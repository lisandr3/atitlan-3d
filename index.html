<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    fromUrl
} from "https://cdn.jsdelivr.net/npm/geotiff@2.1.3/+esm";


// ============================================================
// Z ES VERTICAL
// ============================================================

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);


// ============================================================
// ARCHIVOS
// ============================================================

const RUTA_DEM =
    "data/DEM_unificado.tif";

const RUTA_LAGO =
    "data/lago2.geojson";

const RUTA_GEOLOGIA =
    "data/geologia.geojson";

const RUTA_QML =
    "data/geologia.qml";


// ============================================================
// CONFIGURACIÓN
// ============================================================

const EXAGERACION_VERTICAL = 2.0;

const COLUMNAS = 450;


// Lago Atitlán
const COTA_LAGO = 1562;

const PROFUNDIDAD_VACIADO = 700;


// Resolución de la textura geológica.
//
// 2048 = bastante buena calidad
// sin ser exageradamente pesada.
const TEXTURA_GEOLOGIA = 2048;


// ============================================================
// HTML
// ============================================================

const estado =
    document.getElementById("estado");

const contenedor =
    document.getElementById("visor");


// ============================================================
// ESCENA
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0xb9ced3);


// ============================================================
// CÁMARA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        42,
        window.innerWidth /
        window.innerHeight,
        1,
        250000
    );

camera.up.set(0,0,1);


// ============================================================
// RENDER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

contenedor.appendChild(
    renderer.domElement
);


// ============================================================
// CONTROLES
// ============================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.07;

controls.enablePan = true;

controls.screenSpacePanning = false;

controls.maxPolarAngle =
    Math.PI * 0.49;

controls.minDistance = 100;

controls.maxDistance = 160000;


// ============================================================
// ILUMINACIÓN
// ============================================================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x48515a,
        1.7
    )
);


const sol =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

sol.position.set(
    -20000,
    -25000,
    40000
);

scene.add(sol);


// ============================================================
// VARIABLES DEM
// ============================================================

let demRaster = null;

let demWidth = 0;
let demHeight = 0;

let demNoData = null;

let bbox = null;

let elevMin = Infinity;
let elevMax = -Infinity;

let anchoTerreno = 0;
let altoTerreno = 0;

let centroX = 0;
let centroY = 0;


// ============================================================
// OBJETOS
// ============================================================

let terreno = null;

let aguaGrupo = null;

let texturaGeologia = null;

let geologiaVisible = false;

let lagoVacio = false;

let animandoAgua = false;

let nivelAguaOriginal = 0;


// materiales

let materialTerrenoBase = null;
let materialTerrenoGeologia = null;


// cámara inicial

let camaraInicial =
    new THREE.Vector3();

let objetivoInicial =
    new THREE.Vector3();


// ============================================================
// DEM VÁLIDO
// ============================================================

function valorValido(z) {

    if (!Number.isFinite(z)) {
        return false;
    }

    if (
        demNoData !== null &&
        Number.isFinite(demNoData) &&
        Math.abs(
            z - demNoData
        ) < 0.001
    ) {
        return false;
    }

    return true;
}


// ============================================================
// ELEVACIÓN -> Z
// ============================================================

function elevacionAZ(z) {

    return (
        z -
        elevMin
    ) * EXAGERACION_VERTICAL;

}


// ============================================================
// GTM -> LOCAL
// ============================================================

function gtmALocal(x, y) {

    return new THREE.Vector2(

        x - centroX,

        y - centroY

    );

}


// ============================================================
// CARGAR TODO
// ============================================================

async function iniciar() {

    try {

        await cargarDEM();

        await cargarLago();

        await cargarGeologia();

        estado.innerText =
            "Visor listo";

    }

    catch(error) {

        console.error(error);

        estado.innerText =
            "ERROR: " +
            error.message;

    }

}


// ============================================================
// CARGAR DEM
// ============================================================

async function cargarDEM() {

    estado.innerText =
        "Descargando DEM...";


    const tiff =
        await fromUrl(
            RUTA_DEM
        );


    const image =
        await tiff.getImage();


    bbox =
        image.getBoundingBox();


    demWidth =
        image.getWidth();

    demHeight =
        image.getHeight();


    demRaster =
        await image.readRasters({
            interleave: true
        });


    const nd =
        image.getGDALNoData();


    demNoData =
        nd !== null
            ?
            Number(nd)
            :
            null;


    console.log(
        "BBOX:",
        bbox
    );

    console.log(
        "NoData:",
        demNoData
    );


    anchoTerreno =
        bbox[2] -
        bbox[0];

    altoTerreno =
        bbox[3] -
        bbox[1];


    centroX =
        (
            bbox[0] +
            bbox[2]
        ) / 2;


    centroY =
        (
            bbox[1] +
            bbox[3]
        ) / 2;


    // --------------------------------------------------------
    // MIN / MAX
    // --------------------------------------------------------

    for (
        let i = 0;
        i < demRaster.length;
        i++
    ) {

        const z =
            demRaster[i];


        if (!valorValido(z)) {
            continue;
        }


        elevMin =
            Math.min(
                elevMin,
                z
            );


        elevMax =
            Math.max(
                elevMax,
                z
            );

    }


    console.log(
        "Elevación:",
        elevMin,
        elevMax
    );


    estado.innerText =
        "Construyendo cuenca 3D...";


    crearTerreno();

    prepararCamara();

}


// ============================================================
// CREAR DEM SIN NODATA
// ============================================================

function crearTerreno() {

    const filas =
        Math.round(

            COLUMNAS *
            demHeight /
            demWidth

        );


    const posiciones = [];

    const uvs = [];

    const validos = [];


    // --------------------------------------------------------
    // VÉRTICES
    // --------------------------------------------------------

    for (
        let fila = 0;
        fila < filas;
        fila++
    ) {

        const py =
            Math.round(

                fila /
                (filas - 1) *
                (demHeight - 1)

            );


        const mapY =
            bbox[3] -

            fila /
            (filas - 1) *
            altoTerreno;


        const localY =
            mapY -
            centroY;


        for (
            let col = 0;
            col < COLUMNAS;
            col++
        ) {

            const px =
                Math.round(

                    col /
                    (COLUMNAS - 1) *
                    (demWidth - 1)

                );


            const mapX =
                bbox[0] +

                col /
                (COLUMNAS - 1) *
                anchoTerreno;


            const localX =
                mapX -
                centroX;


            const valor =
                demRaster[
                    py *
                    demWidth +
                    px
                ];


            const valido =
                valorValido(
                    valor
                );


            validos.push(
                valido
            );


            const z =
                valido
                    ?
                    elevacionAZ(valor)
                    :
                    0;


            posiciones.push(

                localX,

                localY,

                z

            );


            // UV geográfico
            //
            // fila 0 = norte
            // v 1 = norte

            const u =
                col /
                (COLUMNAS - 1);


            const v =
                1 -
                fila /
                (filas - 1);


            uvs.push(
                u,
                v
            );

        }

    }


    // --------------------------------------------------------
    // TRIÁNGULOS
    // --------------------------------------------------------

    const indices = [];


    for (
        let fila = 0;
        fila < filas - 1;
        fila++
    ) {

        for (
            let col = 0;
            col < COLUMNAS - 1;
            col++
        ) {

            const a =
                fila *
                COLUMNAS +
                col;

            const b =
                a + 1;

            const c =
                (
                    fila + 1
                ) *
                COLUMNAS +
                col;

            const d =
                c + 1;


            if (
                validos[a] &&
                validos[c] &&
                validos[b]
            ) {

                indices.push(
                    a,
                    c,
                    b
                );

            }


            if (
                validos[b] &&
                validos[c] &&
                validos[d]
            ) {

                indices.push(
                    b,
                    c,
                    d
                );

            }

        }

    }


    // --------------------------------------------------------
    // GEOMETRÍA
    // --------------------------------------------------------

    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.Float32BufferAttribute(
            posiciones,
            3
        )

    );


    geometry.setAttribute(

        "uv",

        new THREE.Float32BufferAttribute(
            uvs,
            2
        )

    );


    geometry.setIndex(
        indices
    );


    geometry.computeVertexNormals();


    // --------------------------------------------------------
    // MATERIAL BASE
    // --------------------------------------------------------

    materialTerrenoBase =
        new THREE.MeshStandardMaterial({

            color:
                0x7d80a5,

            roughness:
                0.88,

            metalness:
                0,

            side:
                THREE.DoubleSide

        });


    terreno =
        new THREE.Mesh(

            geometry,

            materialTerrenoBase

        );


    scene.add(
        terreno
    );


    console.log(
        "Triángulos:",
        indices.length / 3
    );

}


// ============================================================
// CÁMARA
// ============================================================

function prepararCamara() {

    const maxDim =
        Math.max(
            anchoTerreno,
            altoTerreno
        );


    camaraInicial.set(

        maxDim * 0.58,

        -maxDim * 0.72,

        maxDim * 0.52

    );


    objetivoInicial.set(

        0,

        0,

        (
            elevMax -
            elevMin
        ) *
        EXAGERACION_VERTICAL *
        0.15

    );


    camera.position.copy(
        camaraInicial
    );


    controls.target.copy(
        objetivoInicial
    );


    controls.update();

}


// ============================================================
// CREAR SHAPE GTM
// ============================================================

function crearShape(
    poligono
) {

    const exterior =
        poligono[0].map(

            c =>
                gtmALocal(
                    c[0],
                    c[1]
                )

        );


    const shape =
        new THREE.Shape();


    shape.moveTo(
        exterior[0].x,
        exterior[0].y
    );


    for (
        let i = 1;
        i < exterior.length;
        i++
    ) {

        shape.lineTo(

            exterior[i].x,

            exterior[i].y

        );

    }


    // huecos

    for (
        let h = 1;
        h < poligono.length;
        h++
    ) {

        const interior =
            poligono[h].map(

                c =>
                    gtmALocal(
                        c[0],
                        c[1]
                    )

            );


        const hole =
            new THREE.Path();


        hole.moveTo(

            interior[0].x,

            interior[0].y

        );


        for (
            let i = 1;
            i < interior.length;
            i++
        ) {

            hole.lineTo(

                interior[i].x,

                interior[i].y

            );

        }


        shape.holes.push(
            hole
        );

    }


    return shape;

}


// ============================================================
// LAGO
// ============================================================

async function cargarLago() {

    estado.innerText =
        "Cargando lago...";


    const response =
        await fetch(
            RUTA_LAGO
        );


    if (!response.ok) {

        throw new Error(
            "No se encontró lago2.geojson"
        );

    }


    const geojson =
        await response.json();


    aguaGrupo =
        new THREE.Group();


    scene.add(
        aguaGrupo
    );


    const material =
        new THREE.MeshPhysicalMaterial({

            color:
                0x147fa9,

            transparent:
                true,

            opacity:
                0.82,

            roughness:
                0.14,

            metalness:
                0.03,

            transmission:
                0.06,

            side:
                THREE.DoubleSide

        });


    nivelAguaOriginal =
        elevacionAZ(
            COTA_LAGO
        ) + 6;


    aguaGrupo.position.z =
        nivelAguaOriginal;


    for (
        const feature
        of geojson.features
    ) {

        if (!feature.geometry) {
            continue;
        }


        let poligonos = [];


        if (
            feature.geometry.type ===
            "Polygon"
        ) {

            poligonos = [
                feature.geometry.coordinates
            ];

        }


        else if (
            feature.geometry.type ===
            "MultiPolygon"
        ) {

            poligonos =
                feature.geometry.coordinates;

        }


        for (
            const poligono
            of poligonos
        ) {

            const shape =
                crearShape(
                    poligono
                );


            const geometry =
                new THREE.ShapeGeometry(
                    shape
                );


            const mesh =
                new THREE.Mesh(
                    geometry,
                    material
                );


            aguaGrupo.add(
                mesh
            );

        }

    }

}


// ============================================================
// LEER ESTILO QML
// ============================================================

async function leerQML() {

    const response =
        await fetch(
            RUTA_QML
        );


    if (!response.ok) {

        console.warn(
            "geologia.qml no encontrado"
        );

        return null;

    }


    const texto =
        await response.text();


    const xml =
        new DOMParser()
            .parseFromString(
                texto,
                "text/xml"
            );


    const rendererQgis =
        xml.querySelector(
            "renderer-v2"
        );


    if (!rendererQgis) {

        return null;

    }


    const campo =
        rendererQgis.getAttribute(
            "attr"
        );


    const coloresSimbolos =
        new Map();


    // --------------------------------------------------------
    // SÍMBOLOS
    // --------------------------------------------------------

    xml
    .querySelectorAll(
        "symbols > symbol"
    )
    .forEach(
        simbolo => {

            const id =
                simbolo.getAttribute(
                    "name"
                );


            let color =
                null;


            simbolo
            .querySelectorAll(
                "Option"
            )
            .forEach(
                opcion => {

                    const nombre =
                        opcion.getAttribute(
                            "name"
                        );


                    const value =
                        opcion.getAttribute(
                            "value"
                        );


                    if (
                        (
                            nombre === "color" ||
                            nombre === "fill_color"
                        ) &&
                        value &&
                        !color
                    ) {

                        color =
                            value;

                    }

                }
            );


            if (color) {

                coloresSimbolos.set(
                    id,
                    color
                );

            }

        }
    );


    // --------------------------------------------------------
    // CATEGORÍAS
    // --------------------------------------------------------

    const categorias =
        new Map();


    xml
    .querySelectorAll(
        "categories > category"
    )
    .forEach(
        categoria => {

            const value =
                String(
                    categoria.getAttribute(
                        "value"
                    )
                );


            const symbol =
                categoria.getAttribute(
                    "symbol"
                );


            if (
                coloresSimbolos.has(
                    symbol
                )
            ) {

                categorias.set(

                    value,

                    coloresSimbolos.get(
                        symbol
                    )

                );

            }

        }
    );


    console.log(
        "Campo QML:",
        campo
    );


    console.log(
        "Categorías:",
        categorias
    );


    return {
        campo,
        categorias
    };

}


// ============================================================
// QGIS COLOR -> CSS
// ============================================================

function qgisColorACSS(
    color
) {

    if (!color) {

        return "rgb(210,190,150)";

    }


    if (
        color.includes(",")
    ) {

        const p =
            color
            .split(",")
            .map(Number);


        const r =
            p[0] ?? 200;

        const g =
            p[1] ?? 200;

        const b =
            p[2] ?? 200;


        const a =
            p.length >= 4
                ?
                p[3] / 255
                :
                1;


        return `rgba(${r},${g},${b},${a})`;

    }


    return color;

}


// ============================================================
// GTM -> PIXEL DE TEXTURA
// ============================================================

function gtmAPixel(
    x,
    y,
    canvas
) {

    const px =

        (
            x -
            bbox[0]
        ) /
        (
            bbox[2] -
            bbox[0]
        ) *
        canvas.width;


    const py =

        (
            bbox[3] -
            y
        ) /
        (
            bbox[3] -
            bbox[1]
        ) *
        canvas.height;


    return [
        px,
        py
    ];

}


// ============================================================
// DIBUJAR ANILLO
// ============================================================

function dibujarAnillo(
    ctx,
    coords,
    canvas
) {

    if (
        !coords ||
        coords.length === 0
    ) {
        return;
    }


    const primero =
        gtmAPixel(

            coords[0][0],

            coords[0][1],

            canvas

        );


    ctx.moveTo(
        primero[0],
        primero[1]
    );


    for (
        let i = 1;
        i < coords.length;
        i++
    ) {

        const p =
            gtmAPixel(

                coords[i][0],

                coords[i][1],

                canvas

            );


        ctx.lineTo(
            p[0],
            p[1]
        );

    }


    ctx.closePath();

}


// ============================================================
// DIBUJAR POLÍGONO GEOJSON
// ============================================================

function pintarPoligono(
    ctx,
    poligono,
    color,
    canvas
) {

    ctx.beginPath();


    // exterior

    dibujarAnillo(

        ctx,

        poligono[0],

        canvas

    );


    // huecos

    for (
        let h = 1;
        h < poligono.length;
        h++
    ) {

        dibujarAnillo(

            ctx,

            poligono[h],

            canvas

        );

    }


    ctx.fillStyle =
        color;


    ctx.fill(
        "evenodd"
    );

}


// ============================================================
// CREAR TEXTURA GEOLOGÍA
// ============================================================

async function cargarGeologia() {

    estado.innerText =
        "Generando textura geológica...";


    const [
        responseGeo,
        estilo
    ] =
        await Promise.all([

            fetch(
                RUTA_GEOLOGIA
            ),

            leerQML()

        ]);


    if (!responseGeo.ok) {

        throw new Error(
            "No se encontró geologia.geojson"
        );

    }


    const geojson =
        await responseGeo.json();


    console.log(
        "Geología:",
        geojson
    );


    // --------------------------------------------------------
    // CANVAS
    // --------------------------------------------------------

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        TEXTURA_GEOLOGIA;


    // mantener proporción real del DEM

    canvas.height =
        Math.round(

            TEXTURA_GEOLOGIA *
            altoTerreno /
            anchoTerreno

        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // --------------------------------------------------------
    // DIBUJAR TODAS LAS UNIDADES
    // --------------------------------------------------------

    for (
        const feature
        of geojson.features
    ) {

        if (
            !feature.geometry
        ) {
            continue;
        }


        // ----------------------------------------------------
        // COLOR
        // ----------------------------------------------------

        let color =
            "rgba(210,190,150,1)";


        if (
            estilo &&
            estilo.campo
        ) {

            const valor =
                String(

                    feature.properties?.[
                        estilo.campo
                    ] ?? ""

                );


            const colorQml =
                estilo.categorias.get(
                    valor
                );


            if (colorQml) {

                color =
                    qgisColorACSS(
                        colorQml
                    );

            }

        }


        // ----------------------------------------------------
        // GEOMETRÍA
        // ----------------------------------------------------

        if (
            feature.geometry.type ===
            "Polygon"
        ) {

            pintarPoligono(

                ctx,

                feature.geometry.coordinates,

                color,

                canvas

            );

        }


        else if (
            feature.geometry.type ===
            "MultiPolygon"
        ) {

            for (
                const poligono
                of feature.geometry.coordinates
            ) {

                pintarPoligono(

                    ctx,

                    poligono,

                    color,

                    canvas

                );

            }

        }

    }


    // --------------------------------------------------------
    // TEXTURA THREE
    // --------------------------------------------------------

    texturaGeologia =
        new THREE.CanvasTexture(
            canvas
        );


    texturaGeologia.colorSpace =
        THREE.SRGBColorSpace;


    texturaGeologia.anisotropy =
        Math.min(
            8,
            renderer.capabilities
                .getMaxAnisotropy()
        );


    texturaGeologia.needsUpdate =
        true;


    // --------------------------------------------------------
    // MATERIAL GEOLOGÍA
    // --------------------------------------------------------

    materialTerrenoGeologia =
        new THREE.MeshStandardMaterial({

            color:
                0xffffff,

            map:
                texturaGeologia,

            roughness:
                0.90,

            metalness:
                0,

            side:
                THREE.DoubleSide

        });


    // La mostramos inicialmente
    terreno.material =
        materialTerrenoGeologia;


    geologiaVisible =
        true;


    estado.innerText =
        "Geología cargada";


    console.log(
        "Textura geológica:",
        canvas.width,
        "x",
        canvas.height
    );

}


// ============================================================
// TOGGLE GEOLOGÍA
// ============================================================

function alternarGeologia() {

    if (
        !materialTerrenoGeologia
    ) {
        return;
    }


    geologiaVisible =
        !geologiaVisible;


    terreno.material =
        geologiaVisible

            ?

            materialTerrenoGeologia

            :

            materialTerrenoBase;


    estado.innerText =
        geologiaVisible

            ?

            "Geología visible"

            :

            "Geología oculta";

}


// ============================================================
// LAGO
// ============================================================

function animarAgua(
    vaciar
) {

    if (
        !aguaGrupo ||
        animandoAgua
    ) {
        return;
    }


    animandoAgua =
        true;


    const inicio =
        performance.now();


    const zInicial =
        aguaGrupo.position.z;


    const zFinal =

        vaciar

            ?

            nivelAguaOriginal -
            PROFUNDIDAD_VACIADO *
            EXAGERACION_VERTICAL

            :

            nivelAguaOriginal;


    estado.innerText =

        vaciar

            ?

            "Vaciando Lago de Atitlán..."

            :

            "Llenando Lago de Atitlán...";


    function paso(
        ahora
    ) {

        const t =
            Math.min(

                (
                    ahora -
                    inicio
                ) /
                2500,

                1

            );


        const suave =

            t < 0.5

                ?

                2 *
                t *
                t

                :

                1 -
                Math.pow(
                    -2 * t + 2,
                    2
                ) / 2;


        aguaGrupo.position.z =
            THREE.MathUtils.lerp(

                zInicial,

                zFinal,

                suave

            );


        aguaGrupo.traverse(
            obj => {

                if (
                    obj.isMesh &&
                    obj.material
                ) {

                    obj.material.opacity =

                        vaciar

                            ?

                            THREE.MathUtils.lerp(
                                0.82,
                                0.06,
                                suave
                            )

                            :

                            THREE.MathUtils.lerp(
                                0.06,
                                0.82,
                                suave
                            );

                }

            }
        );


        if (
            t < 1
        ) {

            requestAnimationFrame(
                paso
            );

        }

        else {

            lagoVacio =
                vaciar;


            animandoAgua =
                false;


            estado.innerText =

                lagoVacio

                    ?

                    "Lago vacío · batimetría visible"

                    :

                    "Lago lleno";

        }

    }


    requestAnimationFrame(
        paso
    );

}


// ============================================================
// RESTABLECER VISTA
// ============================================================

function restablecerVista() {

    camera.position.copy(
        camaraInicial
    );


    controls.target.copy(
        objetivoInicial
    );


    controls.update();


    estado.innerText =
        "Vista restablecida";

}


// ============================================================
// TECLADO
// ============================================================

window.addEventListener(
    "keydown",
    e => {

        // GEOLOGÍA
        if (
            e.code === "Digit7" ||
            e.code === "Numpad7"
        ) {

            alternarGeologia();

        }


        // LAGO
        if (
            e.code === "Digit8" ||
            e.code === "Numpad8"
        ) {

            animarAgua(
                !lagoVacio
            );

        }


        // RESET
        if (
            e.code === "Digit0" ||
            e.code === "Numpad0"
        ) {

            restablecerVista();

        }

    }
);


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }
);


// ============================================================
// LOOP
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate();


// ============================================================
// INICIAR
// ============================================================

iniciar();

</script>

</body>
</html>
