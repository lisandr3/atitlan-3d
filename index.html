/* ============================================================
   VARIABLES
============================================================ */

let demRaster;

let demWidth;

let demHeight;

let demNoData;


let bbox;

let centroY;

let anchoTerreno;

let altoTerreno;


let elevMin =

let elevMax =

/* ============================================================
   DEM
============================================================ */

function valorValido(
    z
) {

    if (
        !Number.isFinite(
            z
        )
    ) {

        return false;

    }


    if (

        demNoData !== null &&

        Number.isFinite(
            demNoData
        ) &&

        Math.abs(
            z -
            demNoData
        ) < 0.001

    ) {

        return false;

    }


    return true;

}



function elevacionAZ(
    z
) {

    return (

        z -
        elevMin

    ) *
    EXAGERACION_VERTICAL;

}



function elevacionEnGTM(
    x,
    y
) {

    if (

        x < bbox[0] ||
        x > bbox[2] ||

        y < bbox[1] ||
        y > bbox[3]

    ) {

        return null;

    }


    const px =

        Math.round(

            (
                x -
                bbox[0]
            ) /

            (
                bbox[2] -
                bbox[0]
            ) *

            (
                demWidth -
                1
            )

        );


    const py =

        Math.round(

            (
                bbox[3] -
                y
            ) /

            (
                bbox[3] -
                bbox[1]
            ) *

            (
                demHeight -
                1
            )

        );


    const valor =
        demRaster[
            py *
            demWidth +
            px
        ];


    if (
        valorValido(
            valor
        )
    ) {

        return valor;

    }


    /*
        Buscar alrededor para evitar
        puntos justo en borde NoData.
    */

    for (
        let radio = 1;
        radio <= 8;
        radio++
    ) {

        for (
            let dy = -radio;
            dy <= radio;
            dy++
        ) {

            for (
                let dx = -radio;
                dx <= radio;
                dx++
            ) {

                const xx =
                    px + dx;

                const yy =
                    py + dy;


                if (

                    xx < 0 ||
                    xx >= demWidth ||

                    yy < 0 ||
                    yy >= demHeight

                ) {

                    continue;

                }


                const v =
                    demRaster[
                        yy *
                        demWidth +
                        xx
                    ];


                if (
                    valorValido(
                        v
                    )
                ) {

                    return v;

                }

            }

        }

    }


    return null;

}



function gtmALocal(
    x,
    y
) {

    return new THREE.Vector2(

        x -
        centroX,

        y -
        centroY

    );

}



/* ============================================================
   CARGAR DEM
============================================================ */

async function cargarDEM() {

    estado.innerText =
        "Descargando DEM...";


    const tiff =
        await fromUrl(
            RUTA_DEM
        );


    const image =
        await tiff.getImage();


    bbox =
        image.getBoundingBox();


    demWidth =
        image.getWidth();


    demHeight =
        image.getHeight();


    demRaster =
        await image.readRasters({

            interleave:
                true

        });


    const nd =
        image.getGDALNoData();


    demNoData =

        nd !== null

            ?

            Number(nd)

            :

            null;



    anchoTerreno =

        bbox[2] -
        bbox[0];


    altoTerreno =

        bbox[3] -
        bbox[1];


    centroX =

        (
            bbox[0] +
            bbox[2]
        ) / 2;


    centroY =

        (
            bbox[1] +
            bbox[3]
        ) / 2;



    for (
        let i = 0;
        i < demRaster.length;
        i++
    ) {

        const z =
            demRaster[i];


        if (
            !valorValido(
                z
            )
        ) {

            continue;

        }


        elevMin =
            Math.min(
                elevMin,
                z
            );


        elevMax =
            Math.max(
                elevMax,
                z
            );

    }



    crearTerreno();


    prepararCamaraInicial();

}



/* ============================================================
   CREAR MALLA DEM
============================================================ */

function crearTerreno() {

    estado.innerText =
        "Construyendo terreno...";


    const filas =
        Math.round(

            COLUMNAS *
            demHeight /
            demWidth

        );


    const posiciones =
        [];


    const uvs =
        [];


    const validos =
        [];


    for (
        let fila = 0;
        fila < filas;
        fila++
    ) {

        const py =
            Math.round(

                fila /
                (
                    filas -
                    1
                ) *

                (
                    demHeight -
                    1
                )

            );


        const mapY =

            bbox[3] -

            fila /
            (
                filas -
                1
            ) *

            altoTerreno;


        const localY =

            mapY -
            centroY;


        for (
            let col = 0;
            col < COLUMNAS;
            col++
        ) {

            const px =
                Math.round(

                    col /
                    (
                        COLUMNAS -
                        1
                    ) *

                    (
                        demWidth -
                        1
                    )

                );


            const mapX =

                bbox[0] +

                col /
                (
                    COLUMNAS -
                    1
                ) *

                anchoTerreno;


            const localX =

                mapX -
                centroX;


            const z =
                demRaster[
                    py *
                    demWidth +
                    px
                ];


            const valido =
                valorValido(
                    z
                );


            validos.push(
                valido
            );


            posiciones.push(

                localX,

                localY,

                valido
                    ?
                    elevacionAZ(
                        z
                    )
                    :
                    0

            );


            uvs.push(

                col /
                (
                    COLUMNAS -
                    1
                ),

                1 -
                fila /
                (
                    filas -
                    1
                )

            );

        }

    }



    const indices =
        [];


    for (
        let fila = 0;
        fila < filas - 1;
        fila++
    ) {

        for (
            let col = 0;
            col < COLUMNAS - 1;
            col++
        ) {

            const a =
                fila *
                COLUMNAS +
                col;


            const b =
                a + 1;


            const c =
                (
                    fila + 1
                ) *
                COLUMNAS +
                col;


            const d =
                c + 1;


            if (

                validos[a] &&
                validos[c] &&
                validos[b]

            ) {

                indices.push(
                    a,
                    c,
                    b
                );

            }


            if (

                validos[b] &&
                validos[c] &&
                validos[d]

            ) {

                indices.push(
                    b,
                    c,
                    d
                );

            }

        }

    }



    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.Float32BufferAttribute(

            posiciones,

            3

        )

    );


    geometry.setAttribute(

        "uv",

        new THREE.Float32BufferAttribute(

            uvs,

            2

        )

    );


    geometry.setIndex(
        indices
    );


    geometry.computeVertexNormals();



    materialBase =
        new THREE.MeshStandardMaterial({

            color:
                0x7d80a5,

/* ============================================================
   ESTILO QML
============================================================ */

async function leerQML() {

    try {

        const response =
            await fetch(
                RUTA_QML
            );


        if (
            !response.ok
        ) {

            return null;

        }


        const texto =
            await response.text();


        const xml =
            new DOMParser()
            .parseFromString(

                texto,

                "text/xml"

            );


        const rendererQgis =
            xml.querySelector(
                "renderer-v2"
            );


        if (
            !rendererQgis
        ) {

            return null;

        }


        const campo =
            rendererQgis
            .getAttribute(
                "attr"
            );


        const colores =
            new Map();


        xml
        .querySelectorAll(
            "symbols > symbol"
        )
        .forEach(
            simbolo => {

                const id =
                    simbolo
                    .getAttribute(
                        "name"
                    );


                let color =
                    null;


                simbolo
                .querySelectorAll(
                    "Option"
                )
                .forEach(
                    opcion => {

                        const nombre =
                            opcion
                            .getAttribute(
                                "name"
                            );


                        const valor =
                            opcion
                            .getAttribute(
                                "value"
                            );


                        if (

                            (
                                nombre ===
                                "color" ||

                                nombre ===
                                "fill_color"
                            ) &&

                            valor &&

                            !color

                        ) {

                            color =
                                valor;

                        }

                    }

                );


                if (
                    color
                ) {

                    colores.set(
                        id,
                        color
                    );

                }

            }

        );


        const categorias =
            new Map();


        xml
        .querySelectorAll(
            "categories > category"
        )
        .forEach(
            categoria => {

                const value =
                    String(

                        categoria
                        .getAttribute(
                            "value"
                        )

                    );


                const symbol =
                    categoria
                    .getAttribute(
                        "symbol"
                    );


                if (
                    colores.has(
                        symbol
                    )
                ) {

                    categorias.set(

                        value,

                        colores.get(
                            symbol
                        )

                    );

                }

            }

        );


        return {

            campo,

            categorias

        };

    }

    catch {

        return null;

    }

}



function colorQgisCSS(
    color
) {

    if (
        !color
    ) {

        return "#c6b790";

    }


    if (
        color.includes(
            ","
        )
    ) {

        const p =
            color
            .split(",")
            .map(Number);


        return `rgb(${p[0]},${p[1]},${p[2]})`;

    }


    return color;

}



/* ============================================================
   GEOJSON → CANVAS
============================================================ */

function gtmAPixel(
    x,
    y,
    canvas
) {

    return [

        (
            x -
            bbox[0]
        ) /

        (
            bbox[2] -
            bbox[0]
        ) *

        canvas.width,


        (
            bbox[3] -
            y
        ) /

        (
            bbox[3] -
            bbox[1]
        ) *

        canvas.height

    ];

}



function dibujarAnillo(
    ctx,
    coords,
    canvas
) {

    if (
        !coords.length
    ) {

        return;

    }


    const p0 =
        gtmAPixel(

            coords[0][0],

            coords[0][1],

            canvas

        );


    ctx.moveTo(
        p0[0],
        p0[1]
    );


    for (
        let i = 1;
        i < coords.length;
        i++
    ) {

        const p =
            gtmAPixel(

                coords[i][0],

                coords[i][1],

                canvas

            );


        ctx.lineTo(
            p[0],
            p[1]
        );

    }


    ctx.closePath();

}



function pintarPoligono(
    ctx,
    poligono,
    canvas,
    color
) {

    ctx.beginPath();


    dibujarAnillo(

        ctx,

        poligono[0],

        canvas

    );


    for (
        let i = 1;
        i < poligono.length;
        i++
    ) {

        dibujarAnillo(

            ctx,

            poligono[i],

            canvas

        );

    }


    ctx.fillStyle =
        color;


    ctx.fill(
        "evenodd"
    );

}



/* ============================================================
   GEOLOGÍA
============================================================ */

async function cargarGeologia() {

    estado.innerText =
        "Preparando geología...";


    const [
        responseGeo,
        estilo
    ] =
        await Promise.all([

            fetch(
                RUTA_GEOLOGIA
            ),

            leerQML()

        ]);


    geologiaGeoJSON =
        await responseGeo.json();



    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        TEXTURA_RES;


    canvas.height =
        Math.round(

            TEXTURA_RES *
            altoTerreno /
            anchoTerreno

        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#d0d2d5";


    ctx.fillRect(

        0,
        0,

        canvas.width,
        canvas.height

    );



    for (
        const feature
        of geologiaGeoJSON.features
    ) {

        if (
            !feature.geometry
        ) {

            continue;

        }


        let color =
            "#bcae8f";


        if (
            estilo &&
            estilo.campo
        ) {

            const valor =
                String(

                    feature
                    .properties?.[
                        estilo.campo
                    ] ?? ""

                );


            const qml =
                estilo
                .categorias
                .get(
                    valor
                );


            if (
                qml
            ) {

                color =
                    colorQgisCSS(
                        qml
                    );

            }

        }



        if (
            feature.geometry.type ===
            "Polygon"
        ) {

            pintarPoligono(

                ctx,

                feature.geometry.coordinates,

                canvas,

                color

            );

        }


        else if (
            feature.geometry.type ===
            "MultiPolygon"
        ) {

            for (
                const poligono
                of feature.geometry.coordinates
            ) {

                pintarPoligono(

                    ctx,

                    poligono,

                    canvas,

                    color

                );

            }

        }

    }



    texturaGeologia =
        new THREE.CanvasTexture(
            canvas
        );


    texturaGeologia.colorSpace =
        THREE.SRGBColorSpace;


    materialGeologia =
        new THREE.MeshStandardMaterial({

            map:
                texturaGeologia,

            roughness:
                0.9,

            side:
                THREE.DoubleSide

        });


    terreno.material =
        materialGeologia;



    /*
        Después se generará una copia
        con el fondo del lago blanco.
    */

    await crearTexturaLecho(
        canvas
    );

}



/* ============================================================
   LAGO
============================================================ */

function crearShapeLago(
    poligono
) {

    const exterior =
        poligono[0]
        .map(
            c =>
                gtmALocal(
                    c[0],
                    c[1]
                )
        );


    const shape =
        new THREE.Shape();


    shape.moveTo(

        exterior[0].x,

        exterior[0].y

    );


    for (
        let i = 1;
        i < exterior.length;
        i++
    ) {

        shape.lineTo(

            exterior[i].x,

            exterior[i].y

        );

    }


    return shape;

}



async function cargarLago() {

    estado.innerText =
        "Preparando lago...";


    const response =
        await fetch(
            RUTA_LAGO
        );


    const geojson =
        await response.json();



    aguaGrupo =
        new THREE.Group();


    scene.add(

    );


    const material =
        new THREE.MeshPhysicalMaterial({

            color:
                0x1686b3,

            transparent:
                true,

            opacity:
                0.82,

            roughness:
                0.12,

            metalness:
                0.04,

            transmission:
                0.07,

            side:
                THREE.DoubleSide,


            /*
                CLAVE CONTRA Z-FIGHTING
            */

            depthWrite:
                false,

            depthTest:
                true,

            polygonOffset:
                true,

            polygonOffsetFactor:
                -4,

            polygonOffsetUnits:
                -4

        });



    nivelAguaOriginal =

        elevacionAZ(
            COTA_LAGO
        ) +

        OFFSET_AGUA;


    aguaGrupo.position.z =
        nivelAguaOriginal;



    for (
        const feature
        of geojson.features
    ) {

        let poligonos =
            [];


        if (
            feature.geometry.type ===
            "Polygon"
        ) {

            poligonos = [
                feature.geometry.coordinates
            ];

        }


        else if (
            feature.geometry.type ===
            "MultiPolygon"
        ) {

            poligonos =
                feature.geometry.coordinates;

        }



        for (
            const poligono
            of poligonos
        ) {

            const geometry =
                new THREE.ShapeGeometry(

                    crearShapeLago(
                        poligono
                    )

                );


            const mesh =
                new THREE.Mesh(

                    geometry,

                    material

                );


            mesh.renderOrder =
                10;


            aguaGrupo.add(
                mesh
            );

        }

    }


    return geojson;

}



/* ============================================================
   TEXTURA DEL LECHO BLANCO
============================================================ */

async function crearTexturaLecho(
    canvasGeologia
) {

    const response =
        await fetch(
            RUTA_LAGO
        );


    const lago =
        await response.json();



    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        canvasGeologia.width;


    canvas.height =
        canvasGeologia.height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
        Copiar geología
    */

    ctx.drawImage(

        canvasGeologia,

        0,

        0

    );



    /*
        Sobre el lago colocamos
        gris muy claro.

        El sombreado real lo genera
        la iluminación de Three.js
        sobre el relieve batimétrico.
    */

    for (
        const feature
        of lago.features
    ) {

        let poligonos =
            [];


        if (
            feature.geometry.type ===
            "Polygon"
        ) {

            poligonos = [
                feature.geometry.coordinates
            ];

        }


        else if (
            feature.geometry.type ===
            "MultiPolygon"
        ) {

            poligonos =
                feature.geometry.coordinates;

        }


        for (
            const poligono
            of poligonos
        ) {

            pintarPoligono(

                ctx,

                poligono,

                canvas,

                "rgb(232,234,234)"

            );

        }

    }



    texturaLecho =
        new THREE.CanvasTexture(
            canvas
        );


    texturaLecho.colorSpace =
        THREE.SRGBColorSpace;


    materialLecho =
        new THREE.MeshStandardMaterial({

            map:
                texturaLecho,

            roughness:
                0.98,

            metalness:
                0,

            side:
                THREE.DoubleSide

        });

}



/* ============================================================
   VACÍO / LLENO
============================================================ */

function animarAgua(
    vaciar
) {

    if (
        !aguaGrupo ||
        animandoAgua
    ) {

        return;

    }


    animandoAgua =
        true;


    const inicio =
        performance.now();


    const zInicial =
        aguaGrupo.position.z;


    const zFinal =

        vaciar

            ?

            nivelAguaOriginal -

            PROFUNDIDAD_VACIADO *
            EXAGERACION_VERTICAL

            :

            nivelAguaOriginal;



    if (
        vaciar &&
        materialLecho
    ) {

        terreno.material =
            materialLecho;

    }



    estado.innerText =

        vaciar

            ?

            "Descendiendo nivel del lago..."

            :

            "Recuperando nivel del lago...";



    function frame(
        ahora
    ) {

        const t =
            Math.min(

                (
                    ahora -
                    inicio
                ) /
                2600,

                1

            );


        const suave =

            t < 0.5

                ?

                2 *
                t *
                t

                :

                1 -

                Math.pow(

                    -2 *
                    t +
                    2,

                    2

                ) /
                2;



        aguaGrupo.position.z =

            THREE.MathUtils.lerp(

                zInicial,

                zFinal,

                suave

            );



        aguaGrupo.traverse(
            o => {

                if (
                    o.isMesh
                ) {

                    o.material.opacity =

                        vaciar

                            ?

                            THREE.MathUtils.lerp(

                                0.82,

                                0.03,

                                suave

                            )

                            :

                            THREE.MathUtils.lerp(

                                0.03,

                                0.82,

                                suave

                            );

                }

            }

        );



        if (
            t < 1
        ) {

            requestAnimationFrame(
                frame
            );

        }

        else {

            lagoVacio =
                vaciar;


            animandoAgua =
                false;


            if (
                !vaciar
            ) {

                terreno.material =
                    materialGeologia;

            }


            estado.innerText =

                lagoVacio

                    ?

                    "Lecho del lago visible"

                    :

                    "Lago de Atitlán";

        }

    }


    requestAnimationFrame(
        frame
    );

}



/* ============================================================
   GEOMETRÍA DE LAS UNIDADES
============================================================ */

function recorrerCoordenadas(
    coords,
    callback
) {

    if (
        typeof coords[0] ===
        "number"
    ) {

        callback(
            coords
        );

        return;

    }


    for (
        const sub
        of coords
    ) {

        recorrerCoordenadas(

            sub,

            callback

        );

    }

}



function datosFeature(
    feature
) {

    let minX =
        Infinity;

    let maxX =
        -Infinity;

    let minY =
        Infinity;

    let maxY =
        -Infinity;


    const puntos =
        [];


    recorrerCoordenadas(

        feature.geometry.coordinates,

        c => {

            minX =
                Math.min(
                    minX,
                    c[0]
                );


            maxX =
                Math.max(
                    maxX,
                    c[0]
                );


            minY =
                Math.min(
                    minY,
                    c[1]
                );


            maxY =
                Math.max(
                    maxY,
                    c[1]
                );


            puntos.push(
                c
            );

        }

    );



    const centroBBox =
        {

            x:
                (
                    minX +
                    maxX
                ) / 2,

            y:
                (
                    minY +
                    maxY
                ) / 2

        };



    /*
        Elegir un punto real de la geometría
        cercano al centro de su extensión.

        Así evitamos que una etiqueta quede
        en una zona completamente externa
        para polígonos irregulares.
    */

    let mejor =
        puntos[0];


    let mejorDist =
        Infinity;


    for (
        const p
        of puntos
    ) {

        const dx =
            p[0] -
            centroBBox.x;


        const dy =
            p[1] -
            centroBBox.y;


        const dist =
            dx *
            dx +
            dy *
            dy;


        if (
            dist <
            mejorDist
        ) {

            mejorDist =
                dist;


            mejor =
                p;

        }

    }



    return {

        minX,

        maxX,

        minY,

        maxY,


        ancho:
            maxX -
            minX,


        alto:
            maxY -
            minY,


        x:
            mejor[0],


        y:
            mejor[1]

    };

}



/* ============================================================
   MOSTRAR ESCENA GEOLOGÍA
============================================================ */

function activarEscena(
    tecla
) {

    const config =
        ESCENAS[
            tecla
        ];


    if (
        !config ||
        !geologiaGeoJSON
    ) {

        return;

    }



    const feature =
        geologiaGeoJSON
        .features
        .find(

            f =>
                String(
                    f.properties?.[
                        "Simbología"
                    ]
                ) ===
                config.simbolo

        );



    if (
        !feature
    ) {

        estado.innerText =
            "No se encontró " +
            config.simbolo;

        return;

    }



    featureActiva =
        feature;



    const datos =
        datosFeature(
            feature
        );



    const elevacion =
        elevacionEnGTM(

            datos.x,

            datos.y

        );


    const z =

        elevacion !== null

            ?

            elevacionAZ(
                elevacion
            )

            :

            (
                elevMax -
                elevMin
            ) *
            EXAGERACION_VERTICAL *
            0.25;



    const local =
        gtmALocal(

            datos.x,

            datos.y

        );



    puntoEtiqueta3D =
        new THREE.Vector3(

            local.x,

            local.y,

            z +
            180

        );



    /*
        La distancia se calcula
        usando la dimensión de
        la unidad geológica.
    */

    const extension =
        Math.max(

            datos.ancho,

            datos.alto,

            2500

        );


    const distancia =
        THREE.MathUtils.clamp(

            extension *
            1.55,

            6500,

            23000

        );



    /*
        Giro distinto según posición
        de la unidad respecto a la cuenca.

        La cámara queda ligeramente
        hacia fuera de la unidad y
        mirando hacia ella/cuenca.
    */

    const dirX =

        local.x === 0

            ?

            0.7

            :

            Math.sign(
                local.x
            );


    const dirY =

        local.y === 0

            ?

            -0.8

            :

            Math.sign(
                local.y
            );



    const destinoCamara =
        new THREE.Vector3(

            local.x +
            dirX *
            distancia *
            0.65,

            local.y +
            dirY *
            distancia *
            0.70,

            z +
            distancia *
            0.62

        );



    const destinoObjetivo =
        new THREE.Vector3(

            local.x,

            local.y,

            z +
            250

        );



    animarCamara(

        destinoCamara,

        destinoObjetivo

    );



    mostrarEtiqueta(

        feature,

        config

    );


    estado.innerText =

        config.simbolo +
        " · " +
        feature.properties.Litología_;

}



/* ============================================================
   ANIMACIÓN CÁMARA
============================================================ */

function animarCamara(
    destinoPos,
    destinoTarget
) {

    if (
        animandoCamara
    ) {

        return;

    }


    animandoCamara =
        true;


    const inicio =
        performance.now();


    const duracion =
        1800;


    const posInicial =
        camera.position.clone();


    const targetInicial =
        controls.target.clone();



    function frame(
        ahora
    ) {

        const t =
            Math.min(

                (
                    ahora -
                    inicio
                ) /
                duracion,

                1

            );


        const s =

            t <
            0.5

                ?

                2 *
                t *
                t

                :

                1 -

                Math.pow(

                    -2 *
                    t +
                    2,

                    2

                ) /
                2;



        camera.position.lerpVectors(

            posInicial,

            destinoPos,

            s

        );


        controls.target.lerpVectors(

            targetInicial,

            destinoTarget,

            s

        );


        controls.update();



        if (
            t < 1
        ) {

            requestAnimationFrame(
                frame
            );

        }

        else {

            animandoCamara =
                false;

        }

    }


    requestAnimationFrame(
        frame
    );

}

/* ============================================================
   ACTUALIZAR POSICIÓN ETIQUETA
============================================================ */

function actualizarEtiqueta() {

    if (
        !puntoEtiqueta3D ||
        etiqueta.style.display ===
        "none"
    ) {

        return;

    }



    const proyectado =
        puntoEtiqueta3D
        .clone()
        .project(
            camera
        );


    /*
        Ocultar si queda detrás
        de la cámara.
    */

    if (
        proyectado.z <
        -1 ||
        proyectado.z >
        1
    ) {

        etiqueta.style.opacity =
            "0";


        marcador.style.opacity =
            "0";


        return;

    }


    etiqueta.style.opacity =
        "1";


    marcador.style.opacity =
        "1";



    const x =

        (
            proyectado.x *
            0.5 +
            0.5
        ) *

        window.innerWidth;



    const y =

        (
            -
            proyectado.y *
            0.5 +
            0.5
        ) *

        window.innerHeight;



    etiqueta.style.left =
        x +
        "px";


    etiqueta.style.top =
        y +
        "px";


    marcador.style.left =
        x +
        "px";


    marcador.style.top =
        y +
        "px";

}

        "Módulo pendiente de incorporar.";


    fichaTexto.innerText =

        "Esta escena queda reservada para incorporar fotografías, especies representativas, distribución espacial y contenido interpretativo relacionado con " +

        titulo.toLowerCase() +

        " de la Cuenca del Lago de Atitlán.";

}



/* ============================================================
   TECLADO
============================================================ */

window.addEventListener(
    "keydown",
    e => {

        const tecla =
            e.key;


        if (
            ESCENAS[
                tecla
            ]
        ) {

            activarEscena(
                tecla
            );

            return;

        }


        if (
            tecla ===
            "8"
        ) {

            animarAgua(
                !lagoVacio
            );

            return;

        }


        if (
            tecla ===
            "9"
        ) {

            mostrarPlaceholder(
                "Flora"
            );

            return;

        }


        if (
            tecla ===
            "0"
        ) {

            mostrarPlaceholder(
                "Fauna"
            );

        }

    }
);



/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }
);



/* ============================================================
   LOOP
============================================================ */

function animate() {

    requestAnimationFrame(
        animate
    );


    controls.update();


    actualizarEtiqueta();


    renderer.render(

        scene,

        camera

    );

}


animate();



/* ============================================================
   INICIAR
============================================================ */

async function iniciar() {

    try {

        await cargarDEM();

        await cargarGeologia();

        await cargarLago();


        estado.innerText =
            "Visor listo · teclas 1–8";

    }

    catch(
        error
    ) {

        console.error(
            error
        );


        estado.innerText =

            "ERROR: " +
            error.message;

    }

}


iniciar();


</script>
