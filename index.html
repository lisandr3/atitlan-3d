<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cuenca del Lago de Atitlán - Visor 3D</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #visor {
      width: 100%;
      height: 100%;
    }

    #titulo {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 12px 18px;
      border-radius: 8px;
    }

    #titulo h2 {
      margin: 0 0 5px 0;
    }

    #estado {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>

<body>

<div id="titulo">
  <h2>Cuenca del Lago de Atitlán</h2>
  <div id="estado">Cargando DEM...</div>
</div>

<div id="visor"></div>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { fromUrl } from "https://cdn.jsdelivr.net/npm/geotiff@2.1.3/+esm";


// --------------------------------------------------
// ELEMENTOS HTML
// --------------------------------------------------

const contenedor = document.getElementById("visor");
const estado = document.getElementById("estado");


// --------------------------------------------------
// ESCENA
// --------------------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xbfd8e8);


// --------------------------------------------------
// CÁMARA
// --------------------------------------------------

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  1,
  200000
);

camera.position.set(
  0,
  -30000,
  22000
);


// --------------------------------------------------
// RENDER
// --------------------------------------------------

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

contenedor.appendChild(
  renderer.domElement
);


// --------------------------------------------------
// CONTROLES
// --------------------------------------------------

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.target.set(
  0,
  0,
  0
);


// --------------------------------------------------
// ILUMINACIÓN
// --------------------------------------------------

const luzAmbiente =
  new THREE.AmbientLight(
    0xffffff,
    1.4
  );

scene.add(
  luzAmbiente
);


const sol =
  new THREE.DirectionalLight(
    0xffffff,
    2.2
  );

sol.position.set(
  -15000,
  -10000,
  30000
);

scene.add(
  sol
);


// --------------------------------------------------
// PROYECCIÓN GTM
// --------------------------------------------------

proj4.defs(
  "GTM",
  "+proj=tmerc +lat_0=0 +lon_0=-90.5 +k=0.9998 +x_0=500000 +y_0=0 +datum=WGS84 +units=m +no_defs"
);


// --------------------------------------------------
// CARGAR DEM
// --------------------------------------------------

async function cargarDEM() {

  estado.innerText =
    "Descargando DEM...";

  console.log(
    "Intentando cargar DEM..."
  );


  const tiff = await fromUrl(
    "data/DEM_unificado.tif"
  );


  estado.innerText =
    "Leyendo DEM...";


  const image =
    await tiff.getImage();


  console.log(
    "DEM abierto correctamente"
  );


  const bbox =
    image.getBoundingBox();


  console.log(
    "BBOX:",
    bbox
  );


  const widthOriginal =
    image.getWidth();

  const heightOriginal =
    image.getHeight();


  console.log(
    "Tamaño raster:",
    widthOriginal,
    heightOriginal
  );


  const raster =
    await image.readRasters({
      interleave: true
    });


  estado.innerText =
    "Construyendo terreno 3D...";


  // --------------------------------------------------
  // RESOLUCIÓN DEL MODELO 3D
  // --------------------------------------------------

  const columnas = 300;

  const filas =
    Math.round(
      columnas *
      heightOriginal /
      widthOriginal
    );


  const anchoTerreno =
    bbox[2] - bbox[0];

  const altoTerreno =
    bbox[3] - bbox[1];


  // --------------------------------------------------
  // GEOMETRÍA
  // --------------------------------------------------

  const geometry =
    new THREE.PlaneGeometry(
      anchoTerreno,
      altoTerreno,
      columnas - 1,
      filas - 1
    );


  const posiciones =
    geometry.attributes.position;


  // --------------------------------------------------
  // CALCULAR MÍNIMO Y MÁXIMO
  // --------------------------------------------------

  let elevMin = Infinity;
  let elevMax = -Infinity;


  for (
    let i = 0;
    i < posiciones.count;
    i++
  ) {

    const col =
      i % columnas;

    const fila =
      Math.floor(
        i / columnas
      );


    const pixelX =
      Math.floor(
        col /
        (columnas - 1) *
        (widthOriginal - 1)
      );


    const pixelY =
      Math.floor(
        fila /
        (filas - 1) *
        (heightOriginal - 1)
      );


    const indice =
      pixelY *
      widthOriginal +
      pixelX;


    const z =
      raster[indice];


    if (
      Number.isFinite(z) &&
      z > 0 &&
      z < 10000
    ) {

      elevMin =
        Math.min(
          elevMin,
          z
        );

      elevMax =
        Math.max(
          elevMax,
          z
        );

    }

  }


  console.log(
    "Elevación mínima:",
    elevMin
  );

  console.log(
    "Elevación máxima:",
    elevMax
  );


  // --------------------------------------------------
  // EXAGERACIÓN VERTICAL
  // --------------------------------------------------

  const exageracionVertical = 2.0;


  // --------------------------------------------------
  // ASIGNAR ELEVACIONES
  // --------------------------------------------------

  for (
    let i = 0;
    i < posiciones.count;
    i++
  ) {

    const col =
      i % columnas;

    const fila =
      Math.floor(
        i / columnas
      );


    const pixelX =
      Math.floor(
        col /
        (columnas - 1) *
        (widthOriginal - 1)
      );


    const pixelY =
      Math.floor(
        fila /
        (filas - 1) *
        (heightOriginal - 1)
      );


    const indice =
      pixelY *
      widthOriginal +
      pixelX;


    let z =
      raster[indice];


    if (
      !Number.isFinite(z) ||
      z <= 0 ||
      z > 10000
    ) {

      posiciones.setZ(
        i,
        -500
      );

    }

    else {

      posiciones.setZ(
        i,
        (
          z -
          elevMin
        ) *
        exageracionVertical
      );

    }

  }


  geometry.computeVertexNormals();


  // --------------------------------------------------
  // MATERIAL DEL TERRENO
  // --------------------------------------------------

  const material =
    new THREE.MeshStandardMaterial({

      color: 0x6f845d,

      roughness: 0.95,

      metalness: 0,

      side:
        THREE.DoubleSide

    });


  const terreno =
    new THREE.Mesh(
      geometry,
      material
    );


  scene.add(
    terreno
  );


  // --------------------------------------------------
  // GUARDAR INFORMACIÓN DEL DEM
  // --------------------------------------------------

  window.demInfo = {

    bbox,

    elevMin,

    elevMax,

    anchoTerreno,

    altoTerreno,

    exageracionVertical

  };


  console.log(
    "Terreno creado"
  );


  estado.innerText =
    "DEM cargado · cargando lago...";


  await cargarLago();


  estado.innerText =
    "Visor 3D listo";

}


// --------------------------------------------------
// CARGAR GEOJSON DEL LAGO
// --------------------------------------------------

async function cargarLago() {

  const response =
    await fetch(
      "data/lago_ajustado_dem.geojson"
    );


  if (!response.ok) {

    throw new Error(
      "No se pudo cargar el GeoJSON del lago"
    );

  }


  const geojson =
    await response.json();


  console.log(
    "GeoJSON cargado:",
    geojson
  );


  const {
    bbox,
    elevMin,
    exageracionVertical
  } =
    window.demInfo;


  const centroX =
    (
      bbox[0] +
      bbox[2]
    ) / 2;


  const centroY =
    (
      bbox[1] +
      bbox[3]
    ) / 2;


  function convertirCoordenada(
    coord
  ) {

    const lon =
      coord[0];

    const lat =
      coord[1];


    const proyectada =
      proj4(
        "EPSG:4326",
        "GTM",
        [
          lon,
          lat
        ]
      );


    return new THREE.Vector2(

      proyectada[0] -
      centroX,

      proyectada[1] -
      centroY

    );

  }


  for (
    const feature
    of geojson.features
  ) {

    let poligonos = [];


    if (
      feature.geometry.type ===
      "Polygon"
    ) {

      poligonos = [
        feature.geometry.coordinates
      ];

    }


    else if (
      feature.geometry.type ===
      "MultiPolygon"
    ) {

      poligonos =
        feature.geometry.coordinates;

    }


    else {

      continue;

    }


    for (
      const poligono
      of poligonos
    ) {

      const exterior =
        poligono[0].map(
          convertirCoordenada
        );


      const shape =
        new THREE.Shape(
          exterior
        );


      if (
        poligono.length > 1
      ) {

        for (
          let h = 1;
          h < poligono.length;
          h++
        ) {

          const hueco =
            poligono[h].map(
              convertirCoordenada
            );


          const path =
            new THREE.Path(
              hueco
            );


          shape.holes.push(
            path
          );

        }

      }


      const geometry =
        new THREE.ShapeGeometry(
          shape
        );


      const material =
        new THREE.MeshStandardMaterial({

          color: 0x157fad,

          transparent: true,

          opacity: 0.88,

          roughness: 0.3,

          metalness: 0.05,

          side:
            THREE.DoubleSide

        });


      const lago =
        new THREE.Mesh(
          geometry,
          material
        );


      // Lago Atitlán:
      // aproximación inicial.
      // Luego lo afinaremos.

      const nivelLago = 1560;


      lago.position.z =
        (
          nivelLago -
          elevMin
        ) *
        exageracionVertical +
        5;


      scene.add(
        lago
      );

    }

  }


  console.log(
    "Lago creado"
  );

}


// --------------------------------------------------
// REDIMENSIONAR
// --------------------------------------------------

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// --------------------------------------------------
// ANIMACIÓN
// --------------------------------------------------

function animate() {

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();


// --------------------------------------------------
// EJECUTAR
// --------------------------------------------------

cargarDEM()
  .catch(
    error => {

      console.error(
        "ERROR:",
        error
      );


      estado.innerText =
        "ERROR: " +
        error.message;

    }
  );

</script>

</body>
</html>
