<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cuenca del Lago de Atitlán - Visor 3D</title>
<style>
:root {
    --rail-w: clamp(360px, 30vw, 460px);
    --navy: #0f3d5e;
    --navy-2: #174f74;
    --ink: #111820;
    --muted: #55646d;
    --paper: #f7f9fa;
    --line: rgba(15, 61, 94, 0.16);
    --dock-h: 74px;
}

* { box-sizing: border-box; }
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #b9ced3;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
}
button { font: inherit; }

/* =========================================================
   MODELO 3D
========================================================= */
#stage {
    position: fixed;
    inset: 0;
    right: 0;
    overflow: hidden;
    background: #b9ced3;
    transition: right 360ms cubic-bezier(.2,.75,.25,1), bottom 360ms cubic-bezier(.2,.75,.25,1);
}
body.info-open #stage { right: var(--rail-w); }

#visor { position: absolute; inset: 0; }
#visor canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

/* =========================================================
   TÍTULO GENERAL — SIN RECUADRO
========================================================= */
#mainHeader {
    position: absolute;
    top: 14px;
    left: 50%;
    z-index: 45;
    width: min(920px, calc(100% - 36px));
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.72), 0 2px 12px rgba(255,255,255,.45);
}
#mainHeader h1 {
    margin: 0;
    color: var(--navy);
    font-size: clamp(18px, 1.65vw, 26px);
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -.025em;
}
#estado {
    margin-top: 7px;
    color: #36596d;
    font-size: 12px;
    font-weight: 650;
    opacity: .9;
}

/* =========================================================
   DOCK DE 10 ESCENAS — TECLADO + TÁCTIL
========================================================= */
#sceneDock {
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 90;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    border: 1px solid rgba(255,255,255,.30);
    border-radius: 999px;
    background: rgba(13, 39, 54, .78);
    box-shadow: 0 10px 30px rgba(0,0,0,.20);
    backdrop-filter: blur(12px) saturate(125%);
    -webkit-backdrop-filter: blur(12px) saturate(125%);
    transition: bottom 360ms cubic-bezier(.2,.75,.25,1), left 360ms cubic-bezier(.2,.75,.25,1);
}
.scene-key {
    position: relative;
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.26);
    border-radius: 50%;
    background: rgba(255,255,255,.10);
    color: white;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    transition: transform 140ms ease, background 180ms ease, color 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.scene-key:hover { transform: translateY(-2px); background: rgba(255,255,255,.18); }
.scene-key:active { transform: scale(.94); }
.scene-key.is-active {
    background: #ffffff;
    color: var(--navy);
    border-color: #ffffff;
    box-shadow: 0 0 0 4px rgba(255,255,255,.13), 0 6px 14px rgba(0,0,0,.22);
}
.scene-key[data-key="8"].is-active {
    background: #bde8f7;
    border-color: #dff6ff;
    color: #0b4c70;
}
.scene-key::after {
    content: attr(data-label);
    position: absolute;
    left: 50%;
    bottom: calc(100% + 10px);
    transform: translateX(-50%) translateY(4px);
    white-space: nowrap;
    padding: 6px 8px;
    border-radius: 7px;
    background: rgba(10,27,37,.92);
    color: white;
    font-size: 11px;
    font-weight: 650;
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms ease, transform 150ms ease;
}
.scene-key:hover::after,
.scene-key:focus-visible::after { opacity: 1; transform: translateX(-50%) translateY(0); }
.scene-key:focus-visible { outline: 3px solid rgba(255,255,255,.65); outline-offset: 2px; }
body.info-open #sceneDock {
    left: calc((100vw - var(--rail-w)) / 2);
}

/* =========================================================
   FICHA LATERAL LIMPIA — SIN TARJETA SOBRE TARJETA
========================================================= */
#infoRail {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: var(--rail-w);
    z-index: 70;
    padding: 26px 28px 92px;
    background: rgba(248, 250, 251, .985);
    border-left: 1px solid var(--line);
    box-shadow: -14px 0 38px rgba(15, 42, 57, .13);
    transform: translateX(100%);
    transition: transform 360ms cubic-bezier(.2,.75,.25,1);
    overflow: hidden;
}
body.info-open #infoRail { transform: translateX(0); }

#infoCard {
    position: relative;
    height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 6px 4px 28px;
    scrollbar-width: thin;
}
#cerrarInfo {
    position: sticky;
    top: 0;
    float: right;
    z-index: 3;
    width: 38px;
    height: 38px;
    margin: 0 0 4px 10px;
    border: 1px solid rgba(15,61,94,.15);
    border-radius: 50%;
    background: rgba(255,255,255,.90);
    color: #16384b;
    font-size: 22px;
    line-height: 34px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
}
#cerrarInfo:hover { background: #eef4f7; }
#infoCodigoWrap { text-align: center; clear: both; }
#infoCodigo {
    display: inline-block;
    min-width: 44px;
    padding: 5px 11px;
    margin: 5px auto 10px;
    border-radius: 999px;
    background: var(--navy);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .03em;
}
#infoTitulo {
    margin: 0 auto 24px;
    max-width: 390px;
    color: #0d1117;
    font-size: clamp(18px, 1.45vw, 23px);
    line-height: 1.12;
    text-align: center;
    font-weight: 800;
    letter-spacing: -.015em;
}
.info-section {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #dce4e8;
}
.info-section:first-of-type { margin-top: 0; }
.info-section h4 {
    margin: 0 0 10px;
    color: #111820;
    font-size: 14px;
    line-height: 1.25;
    text-align: center;
    font-weight: 800;
}
.info-section p {
    margin: 0;
    color: #27343c;
    font-size: 14px;
    line-height: 1.68;
    text-align: justify;
    text-wrap: pretty;
}
#infoGeologia { white-space: pre-line; }

/* =========================================================
   CALLOUT 3D -> FICHA
========================================================= */
#calloutSvg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    /* Debajo de las rocas (68) y de la ficha (70). */
    z-index: 62;
    pointer-events: none;
    overflow: visible;
}
#calloutLine {
    fill: none;
    stroke: rgba(15, 61, 94, .86);
    stroke-width: 2.1;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1 0;
    filter: drop-shadow(0 1px 1px rgba(255,255,255,.9));
}
#calloutHalo {
    fill: rgba(255,255,255,.97);
    stroke: rgba(15,61,94,.95);
    stroke-width: 2.6;
}
#calloutCore { fill: var(--navy); }

/* =========================================================
   MUESTRAS DE ROCA — PNG/WEBP TRANSPARENTES
   El callout queda en una capa inferior; las imágenes y sus
   rótulos flotan sin tarjetas, bordes ni fondos.
========================================================= */
#rockGallery {
    position: absolute;
    /* Zona alta libre: debajo del título y antes de la ficha lateral. */
    top: 82px;
    right: 22px;
    z-index: 68;
    width: clamp(145px, 12vw, 190px);
    display: grid;
    align-content: start;
    justify-items: center;
    gap: 8px;
    transform: translateX(16px) translateY(-4px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 260ms ease, transform 320ms cubic-bezier(.2,.75,.25,1), visibility 0s linear 320ms;
}
#rockGallery.is-visible {
    opacity: 1;
    visibility: visible;
    transform: translateX(0) translateY(0);
    transition-delay: 0s;
}
.rock-sample {
    position: relative;
    width: 100%;
    margin: 0;
    display: grid;
    justify-items: center;
    align-items: end;
    background: transparent;
    border: 0;
    box-shadow: none;
    overflow: visible;
}
.rock-sample img {
    display: block;
    width: 100%;
    height: auto;
    max-height: clamp(125px, 22vh, 220px);
    object-fit: contain;
    background: transparent;
    border: 0;
    border-radius: 0;
    filter: drop-shadow(0 10px 13px rgba(15,42,57,.22));
    transition: opacity 220ms ease;
}
.rock-sample.is-loading figcaption { opacity: .72; }
.rock-sample.is-missing figcaption::after {
    content: " · imagen pendiente";
    font-weight: 650;
    opacity: .62;
}
.rock-sample figcaption {
    margin-top: 3px;
    padding: 0;
    color: #0f3651;
    font-size: 12px;
    line-height: 1.08;
    font-weight: 850;
    text-align: center;
    letter-spacing: .01em;
    text-shadow:
        0 1px 0 rgba(255,255,255,1),
        1px 0 0 rgba(255,255,255,.95),
        -1px 0 0 rgba(255,255,255,.95),
        0 -1px 0 rgba(255,255,255,.95),
        0 3px 10px rgba(255,255,255,.85);
}
#rockGallery[data-count="3"] {
    width: clamp(300px, 25vw, 390px);
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: end;
    gap: 8px;
}
#rockGallery[data-count="3"] .rock-sample img {
    max-height: clamp(82px, 12vh, 118px);
}
#rockGallery[data-count="3"] .rock-sample figcaption {
    font-size: 10.5px;
}

/* =========================================================
   RESPONSIVE / TELÉFONO
========================================================= */
@media (max-width: 900px) {
    :root { --rail-w: 100vw; }
    #mainHeader { top: 10px; width: calc(100% - 28px); }
    #mainHeader h1 { font-size: clamp(16px, 4.4vw, 21px); }
    #estado { margin-top: 4px; font-size: 10.5px; }

    body.info-open #stage {
        right: 0;
        bottom: 50dvh;
    }
    #infoRail {
        top: auto;
        left: 0;
        right: 0;
        width: 100vw;
        height: 50dvh;
        padding: 14px 18px 22px;
        border-left: 0;
        border-top: 1px solid var(--line);
        border-radius: 20px 20px 0 0;
        transform: translateY(100%);
        box-shadow: 0 -14px 32px rgba(15,42,57,.16);
    }
    body.info-open #infoRail { transform: translateY(0); }
    #infoCard { padding: 2px 2px 18px; }
    #infoTitulo { font-size: 18px; margin-bottom: 14px; padding: 0 24px; }
    .info-section { margin-top: 15px; padding-top: 14px; }
    .info-section h4 { font-size: 14px; }
    .info-section p { font-size: 13.5px; line-height: 1.58; text-align: left; }

    #rockGallery {
        top: 62px;
        right: 8px;
        left: auto;
        bottom: auto;
        width: min(126px, 31vw);
        grid-template-columns: 1fr;
        gap: 3px;
        transform: translateX(10px) translateY(-3px);
    }
    #rockGallery.is-visible { transform: translateX(0) translateY(0); }
    #rockGallery[data-count="3"] {
        width: min(285px, calc(100vw - 20px));
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 3px;
    }
    .rock-sample img {
        width: min(120px, 29vw);
        max-height: 92px;
    }
    #rockGallery[data-count="3"] .rock-sample img {
        width: 100%;
        max-height: 66px;
    }
    .rock-sample figcaption,
    #rockGallery[data-count="3"] .rock-sample figcaption {
        margin-top: 1px;
        font-size: 10px;
    }

    #sceneDock {
        left: 50%;
        width: min(360px, calc(100vw - 18px));
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 7px 9px;
        padding: 9px 12px;
        border-radius: 24px;
    }
    .scene-key {
        width: 44px;
        height: 44px;
        min-width: 44px;
        justify-self: center;
        font-size: 13px;
    }
    .scene-key::after { display: none; }
    body.info-open #sceneDock { left: 50%; bottom: calc(50dvh + 10px); }
}

@media (max-width: 430px) {
    #sceneDock { width: calc(100vw - 12px); gap: 6px; padding: 8px 10px; }
    .scene-key { width: 44px; height: 44px; min-width: 44px; }
    body.info-open #sceneDock { bottom: calc(50dvh + 6px); }
}

@media (max-height: 650px) and (max-width: 900px) {
    body.info-open #stage { bottom: 56dvh; }
    #infoRail { height: 56dvh; }
    body.info-open #sceneDock { bottom: calc(56dvh + 6px); }
}
</style>

</head>
<body>

<div id="stage">
    <div id="visor"></div>

    <header id="mainHeader">
        <h1>Geología, Fauna y Flora de la Cuenca del Lago de Atitlán</h1>
        <div id="estado">Cargando modelo 3D…</div>
    </header>

    <!-- Las muestras se crean dinámicamente según la escena geológica.
         Archivos esperados en data/: 1.png ... 9.png. -->
    <div id="rockGallery" aria-hidden="true"></div>
</div>

<aside id="infoRail" aria-hidden="true">
    <div id="infoCard">
        <button id="cerrarInfo" type="button" aria-label="Cerrar ficha">×</button>
        <div id="infoCodigoWrap"><div id="infoCodigo"></div></div>
        <h2 id="infoTitulo"></h2>

        <section class="info-section">
            <h4 id="infoSeccion1Titulo">Descripción geológica</h4>
            <p id="infoGeologia"></p>
        </section>

        <section class="info-section">
            <h4 id="infoSeccion2Titulo">Suelos y vegetación</h4>
            <p id="infoEdafologia"></p>
        </section>
    </div>
</aside>

<nav id="sceneDock" aria-label="Escenas del visor">
    <button class="scene-key" type="button" data-key="1" data-label="Geología · Qpa4" aria-label="Escena 1, geología Qpa4">1</button>
    <button class="scene-key" type="button" data-key="2" data-label="Geología · Qpf3" aria-label="Escena 2, geología Qpf3">2</button>
    <button class="scene-key" type="button" data-key="3" data-label="Geología · Tmt4" aria-label="Escena 3, geología Tmt4">3</button>
    <button class="scene-key" type="button" data-key="4" data-label="Geología · Tcf2" aria-label="Escena 4, geología Tcf2">4</button>
    <button class="scene-key" type="button" data-key="5" data-label="Geología · QTa" aria-label="Escena 5, geología QTa">5</button>
    <button class="scene-key" type="button" data-key="6" data-label="Geología · Qa" aria-label="Escena 6, geología Qa">6</button>
    <button class="scene-key" type="button" data-key="7" data-label="Geología · Tg" aria-label="Escena 7, geología Tg">7</button>
    <button class="scene-key" type="button" data-key="8" data-label="Lago / lecho" aria-label="Escena 8, vaciar o llenar lago">8</button>
    <button class="scene-key" type="button" data-key="9" data-label="Flora" aria-label="Escena 9, flora">9</button>
    <button class="scene-key" type="button" data-key="0" data-label="Fauna" aria-label="Escena 0, fauna">0</button>
</nav>

<svg id="calloutSvg" aria-hidden="true">
    <polyline id="calloutLine" points=""></polyline>
    <circle id="calloutHalo" cx="0" cy="0" r="6.5"></circle>
    <circle id="calloutCore" cx="0" cy="0" r="3"></circle>
</svg>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { fromUrl } from "https://cdn.jsdelivr.net/npm/geotiff@2.1.3/+esm";

/* ============================================================
   CONFIGURACIÓN
============================================================ */
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

const RUTA_DEM = "data/DEM_unificado.tif";
const RUTA_LAGO = "data/lago2.geojson";
const RUTA_GEOLOGIA = "data/geologia.geojson";
const RUTA_QML = "data/geologia.qml";

const EXAGERACION_VERTICAL = 2.0;
const COLUMNAS = 450;
const TEXTURA_RES = 2048;
const COTA_LAGO = 1562;
const OFFSET_AGUA = 10;
const DURACION_AGUA = 4600;
const TEXTURA_ALTURA_RES = 1200;
const MARGEN_VACIADO_METROS = 24;

/* ============================================================
   ESCENAS GEOLÓGICAS
   Los textos son interpretativos; los campos reales del GeoJSON
   se incorporan dinámicamente en la ficha.
============================================================ */
const ESCENAS = {
    "1": {
        simbolo: "Qpa4",
        resumen: "Depósitos de pómez y ceniza vinculados a erupciones silíceas posteriores al gran episodio de Los Chocoyos. En el paisaje funcionan como una cubierta volcánica relativamente joven que puede recubrir materiales más antiguos y suavizar parcialmente la expresión de las unidades subyacentes.",
        edafologia: "Los materiales pumíceos y las cenizas volcánicas suelen generar sustratos muy porosos y de baja densidad aparente. Cuando la ceniza se meteoriza, puede producir suelos con buena retención de agua y abundante materia orgánica, pero también con una fuerte capacidad de fijar fósforo, de modo que la fertilidad química no depende únicamente de que el suelo sea profundo. Las capas gruesas de pómez, en cambio, pueden drenar con rapidez y almacenar menos agua disponible durante la época seca. Para las plantas esto significa una combinación favorable de aireación radicular y facilidad de penetración de raíces, pero con contrastes locales importantes en humedad y nutrientes según el espesor de la ceniza, la proporción de pómez y la pendiente. En laderas fuertes, la erosión puede retirar rápidamente el horizonte superficial fértil si la cobertura vegetal se pierde."
    },
    "2": {
        simbolo: "Qpf3",
        resumen: "Grandes depósitos de flujo piroclástico asociados al evento de Los Chocoyos. Incluyen ceniza, lapilli, pómez y fragmentos líticos depositados rápidamente por corrientes volcánicas densas y calientes, por lo que constituyen una referencia fundamental para reconstruir la historia explosiva de la cuenca.",
        edafologia: "Un depósito piroclástico de este tipo es muy heterogéneo: puede contener niveles finos de ceniza, capas pumíceas gruesas y sectores más compactos. Esa heterogeneidad se transmite al suelo. Los niveles finos y meteorizados pueden retener bastante humedad y favorecer el desarrollo de suelos volcánicos ricos en materia orgánica; los niveles gruesos pueden ser más drenantes y pobres en agua disponible. Cuando el material está endurecido o poco meteorizado, la profundidad efectiva de raíces disminuye. Además, en pendientes pronunciadas estos depósitos son susceptibles a erosión y remoción en masa, de modo que la estabilidad del suelo y la permanencia de la vegetación dependen mucho de conservar cobertura y estructura radicular."
    },
    "3": {
        simbolo: "Tmt4",
        resumen: "Toba cristalina consolidada de María Tecún, con abundantes componentes minerales como cuarzo, feldespatos, plagioclasas, biotita y moscovita. Representa un material volcánico más consolidado que los depósitos pumíceos recientes y permite observar una etapa distinta de la evolución geológica regional.",
        edafologia: "Al tratarse de una toba consolidada, la formación del suelo depende mucho del grado de fracturación y meteorización de la roca. Donde la alteración es intensa pueden desarrollarse horizontes relativamente finos, con aporte de minerales procedentes de feldespatos y micas; donde la roca permanece compacta, los suelos tienden a ser más someros y las raíces se concentran en fracturas y zonas alteradas. En pendientes elevadas la escorrentía puede dominar sobre la infiltración y aumentar la erosión. Para la vegetación, las mejores condiciones suelen encontrarse en superficies más estables y meteorizadas, donde existe mayor volumen de suelo, mientras que afloramientos duros o laderas muy inclinadas limitan el almacenamiento de agua y el anclaje radicular."
    },
    "4": {
        simbolo: "Tcf2",
        resumen: "Secuencia sedimentaria de relleno de caldera, con areniscas, lutitas y pizarras estratificadas y, localmente, intercalaciones conglomeráticas. Es importante porque muestra que la cuenca no registra únicamente volcanismo: también conserva etapas de sedimentación y relleno posteriores o contemporáneas a grandes episodios eruptivos.",
        edafologia: "La alternancia de areniscas, lutitas y pizarras produce cambios muy marcados en textura, drenaje y profundidad del suelo a distancias cortas. Las capas finas derivadas de lutitas pueden favorecer mayor retención de agua y formación de fracciones arcillosas, pero también pueden presentar drenaje lento si se compactan. Las areniscas suelen generar materiales más gruesos y permeables. Esta estratificación puede originar niveles donde el agua se acumula sobre capas menos permeables, afectando tanto la estabilidad de laderas como la disponibilidad hídrica para las raíces. Para el crecimiento vegetal, esa variabilidad significa que dos sitios cercanos pueden responder de forma distinta al mismo régimen de lluvia y manejo."
    },
    "5": {
        simbolo: "QTa",
        resumen: "Conjunto volcánico terciario-cuaternario formado principalmente por lavas, depósitos de lodo y materiales piroclásticos de composición andesítica. Su distribución refleja fases prolongadas de construcción volcánica anteriores y parcialmente contemporáneas al desarrollo de los grandes edificios volcánicos cuaternarios.",

/* ============================================================
   UTILIDADES DEM
============================================================ */
function valorValido(z) {
    if (!Number.isFinite(z)) return false;
    if (demNoData !== null && Number.isFinite(demNoData) && Math.abs(z - demNoData) < 0.001) return false;
    return true;
}

function elevacionAZ(z) {
    return (z - elevMin) * EXAGERACION_VERTICAL;
}

function elevacionEnGTM(x, y) {
    if (!bbox || x < bbox[0] || x > bbox[2] || y < bbox[1] || y > bbox[3]) return null;

    const px = Math.round((x - bbox[0]) / (bbox[2] - bbox[0]) * (demWidth - 1));
    const py = Math.round((bbox[3] - y) / (bbox[3] - bbox[1]) * (demHeight - 1));
    const valor = demRaster[py * demWidth + px];
    if (valorValido(valor)) return valor;

    for (let radio = 1; radio <= 10; radio++) {
        for (let dy = -radio; dy <= radio; dy++) {
            for (let dx = -radio; dx <= radio; dx++) {
                const xx = px + dx, yy = py + dy;
                if (xx < 0 || xx >= demWidth || yy < 0 || yy >= demHeight) continue;
                const v = demRaster[yy * demWidth + xx];
                if (valorValido(v)) return v;
            }
        }
    }
    return null;
}

function gtmALocal(x, y) {
    return new THREE.Vector2(x - centroX, y - centroY);
}

/* ============================================================
   CARGA DEL DEM Y MALLA SIN NODATA
============================================================ */
async function cargarDEM() {
    estado.textContent = "Descargando DEM...";
    const tiff = await fromUrl(RUTA_DEM);
    const image = await tiff.getImage();

    bbox = image.getBoundingBox();
    demWidth = image.getWidth();
    demHeight = image.getHeight();
    demRaster = await image.readRasters({ interleave: true });

    const nd = image.getGDALNoData();
    demNoData = nd !== null ? Number(nd) : null;

    anchoTerreno = bbox[2] - bbox[0];
    altoTerreno = bbox[3] - bbox[1];
    centroX = (bbox[0] + bbox[2]) / 2;
    centroY = (bbox[1] + bbox[3]) / 2;

    for (let i = 0; i < demRaster.length; i++) {
        const z = demRaster[i];
        if (!valorValido(z)) continue;
        elevMin = Math.min(elevMin, z);
        elevMax = Math.max(elevMax, z);
    }

    crearTerreno();
    prepararCamaraInicial();
}

function crearTerreno() {
    estado.textContent = "Construyendo terreno...";
    const filas = Math.max(2, Math.round(COLUMNAS * demHeight / demWidth));
    const posiciones = [];
    const uvs = [];
    const validos = [];

    for (let fila = 0; fila < filas; fila++) {
        const py = Math.round(fila / (filas - 1) * (demHeight - 1));
        const mapY = bbox[3] - fila / (filas - 1) * altoTerreno;
        const localY = mapY - centroY;

        for (let col = 0; col < COLUMNAS; col++) {
            const px = Math.round(col / (COLUMNAS - 1) * (demWidth - 1));
            const mapX = bbox[0] + col / (COLUMNAS - 1) * anchoTerreno;
            const localX = mapX - centroX;
            const z = demRaster[py * demWidth + px];
            const valido = valorValido(z);
            validos.push(valido);
            posiciones.push(localX, localY, valido ? elevacionAZ(z) : 0);
            uvs.push(col / (COLUMNAS - 1), 1 - fila / (filas - 1));
        }
    }

    const indices = [];
    for (let fila = 0; fila < filas - 1; fila++) {
        for (let col = 0; col < COLUMNAS - 1; col++) {
            const a = fila * COLUMNAS + col;
            const b = a + 1;
            const c = (fila + 1) * COLUMNAS + col;
            const d = c + 1;
            if (validos[a] && validos[c] && validos[b]) indices.push(a, c, b);
            if (validos[b] && validos[c] && validos[d]) indices.push(b, c, d);
        }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.Float32BufferAttribute(posiciones, 3));
    geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();

    materialBase = new THREE.MeshStandardMaterial({
        color: 0x7d80a5,
        roughness: 0.9,
        side: THREE.DoubleSide
    });

    terreno = new THREE.Mesh(geometry, materialBase);
    scene.add(terreno);
}

function prepararCamaraInicial() {
    const maxDim = Math.max(anchoTerreno, altoTerreno);
    camera.position.set(maxDim * 0.58, -maxDim * 0.70, maxDim * 0.52);
    controls.target.set(0, 0, (elevMax - elevMin) * EXAGERACION_VERTICAL * 0.15);
    controls.update();
}

/* ============================================================
   QML -> COLORES
============================================================ */
async function leerQML() {
    try {
        const response = await fetch(RUTA_QML);
        if (!response.ok) return null;
        const texto = await response.text();
        const xml = new DOMParser().parseFromString(texto, "text/xml");
        const rendererQgis = xml.querySelector("renderer-v2");
        if (!rendererQgis) return null;

        const campo = rendererQgis.getAttribute("attr");
        const colores = new Map();

        xml.querySelectorAll("symbols > symbol").forEach(simbolo => {
            const id = simbolo.getAttribute("name");
            let color = null;
            simbolo.querySelectorAll("Option").forEach(opcion => {
                const nombre = opcion.getAttribute("name");
                const valor = opcion.getAttribute("value");
                if ((nombre === "color" || nombre === "fill_color") && valor && !color) color = valor;
            });
            if (color) colores.set(id, color);
        });

        const categorias = new Map();
        xml.querySelectorAll("categories > category").forEach(categoria => {
            const value = String(categoria.getAttribute("value"));
            const symbol = categoria.getAttribute("symbol");
            if (colores.has(symbol)) categorias.set(value, colores.get(symbol));
        });

        return { campo, categorias };
    } catch (e) {
        console.warn("No se pudo leer el QML:", e);
        return null;
    }
}

function colorQgisCSS(color) {
    if (!color) return "#c6b790";
    if (color.includes(",")) {
        const p = color.split(",").map(Number);
        return `rgb(${p[0]},${p[1]},${p[2]})`;
    }
    return color;
}

/* ============================================================
   GEOJSON -> CANVAS
============================================================ */
function gtmAPixel(x, y, canvas) {
    return [
        (x - bbox[0]) / (bbox[2] - bbox[0]) * canvas.width,
        (bbox[3] - y) / (bbox[3] - bbox[1]) * canvas.height
    ];
}

function dibujarAnillo(ctx, coords, canvas) {
    if (!coords?.length) return;
    const p0 = gtmAPixel(coords[0][0], coords[0][1], canvas);
    ctx.moveTo(p0[0], p0[1]);
    for (let i = 1; i < coords.length; i++) {
        const p = gtmAPixel(coords[i][0], coords[i][1], canvas);
        ctx.lineTo(p[0], p[1]);
    }
    ctx.closePath();
}

function pintarPoligono(ctx, poligono, canvas, color) {
    ctx.beginPath();
    dibujarAnillo(ctx, poligono[0], canvas);
    for (let i = 1; i < poligono.length; i++) dibujarAnillo(ctx, poligono[i], canvas);
    ctx.fillStyle = color;
    ctx.fill("evenodd");
}

async function cargarGeologia() {
    estado.textContent = "Preparando geología…";
    const [responseGeo, estilo] = await Promise.all([fetch(RUTA_GEOLOGIA), leerQML()]);
    if (!responseGeo.ok) throw new Error("No se pudo cargar geologia.geojson");
    geologiaGeoJSON = await responseGeo.json();

    const canvas = document.createElement("canvas");
    canvas.width = TEXTURA_RES;
    canvas.height = Math.round(TEXTURA_RES * altoTerreno / anchoTerreno);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#d0d2d5";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (const feature of geologiaGeoJSON.features || []) {
        if (!feature.geometry) continue;
        let color = "#bcae8f";

        if (estilo?.campo) {
            const valor = String(feature.properties?.[estilo.campo] ?? "");
            const qml = estilo.categorias.get(valor);
            if (qml) color = colorQgisCSS(qml);
        }

        if (feature.geometry.type === "Polygon") {
            pintarPoligono(ctx, feature.geometry.coordinates, canvas, color);
        } else if (feature.geometry.type === "MultiPolygon") {
            for (const poligono of feature.geometry.coordinates) pintarPoligono(ctx, poligono, canvas, color);
        }
    }

    texturaGeologia = new THREE.CanvasTexture(canvas);
    texturaGeologia.colorSpace = THREE.SRGBColorSpace;
    texturaGeologia.anisotropy = renderer.capabilities.getMaxAnisotropy();

    // Se prepara la segunda textura antes de crear el material. De esa forma
    // el paso geología -> lecho ocurre dentro del MISMO material y la MISMA
    // malla del DEM, evitando parpadeos entre superficies coincidentes.
    texturaLecho = await crearTexturaLecho(canvas);

    materialGeologia = new THREE.MeshStandardMaterial({
        map: texturaGeologia,
        roughness: 0.92,
        metalness: 0,
        side: THREE.DoubleSide
    });

    materialGeologia.userData.lechoMix = 0;
    materialGeologia.onBeforeCompile = shader => {
        shader.uniforms.lechoMap = { value: texturaLecho };
        shader.uniforms.uLechoMix = { value: materialGeologia.userData.lechoMix || 0 };
        materialGeologia.userData.shader = shader;

        shader.fragmentShader = shader.fragmentShader.replace(
            "#include <map_pars_fragment>",
            `#include <map_pars_fragment>\nuniform sampler2D lechoMap;\nuniform float uLechoMix;`
        );

        shader.fragmentShader = shader.fragmentShader.replace(
            "#include <map_fragment>",
            `#ifdef USE_MAP
                vec4 sampledDiffuseColor = texture2D( map, vMapUv );
                vec4 sampledLechoColor = texture2D( lechoMap, vMapUv );
                sampledDiffuseColor = mix( sampledDiffuseColor, sampledLechoColor, uLechoMix );
                diffuseColor *= sampledDiffuseColor;
            #endif`
        );
    };
    materialGeologia.customProgramCacheKey = () => "atitlan-terreno-lecho-blend-v2";

    terreno.material = materialGeologia;
}

function setLechoMix(valor) {
    lechoMix = THREE.MathUtils.clamp(valor, 0, 1);
    if (!materialGeologia) return;
    materialGeologia.userData.lechoMix = lechoMix;
    if (materialGeologia.userData.shader?.uniforms?.uLechoMix) {
        materialGeologia.userData.shader.uniforms.uLechoMix.value = lechoMix;
    }
}

/* ============================================================
   LAGO
============================================================ */
function crearShapeLago(poligono) {
    const exterior = poligono[0].map(c => gtmALocal(c[0], c[1]));
    const shape = new THREE.Shape();
    shape.moveTo(exterior[0].x, exterior[0].y);
    for (let i = 1; i < exterior.length; i++) shape.lineTo(exterior[i].x, exterior[i].y);

    for (let h = 1; h < poligono.length; h++) {
        const holeCoords = poligono[h].map(c => gtmALocal(c[0], c[1]));
        if (!holeCoords.length) continue;
        const hole = new THREE.Path();
        hole.moveTo(holeCoords[0].x, holeCoords[0].y);
        for (let i = 1; i < holeCoords.length; i++) hole.lineTo(holeCoords[i].x, holeCoords[i].y);
        shape.holes.push(hole);
    }
    return shape;
}

function centroBBoxGeoJSON(geojson) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const visitar = coords => {
        if (!Array.isArray(coords)) return;
        if (typeof coords[0] === "number") {
            const x = coords[0], y = coords[1];
            if (Number.isFinite(x) && Number.isFinite(y)) {
                minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                minY = Math.min(minY, y); maxY = Math.max(maxY, y);
            }
            return;
        }
        for (const c of coords) visitar(c);
    };
    for (const f of geojson.features || []) if (f.geometry) visitar(f.geometry.coordinates);
    if (!Number.isFinite(minX)) return new THREE.Vector2(0, 0);
    return gtmALocal((minX + maxX) / 2, (minY + maxY) / 2);
}

function crearTexturaAlturaParaLago(lagoGeoJSON) {
    const w = Math.max(256, Math.min(TEXTURA_ALTURA_RES, demWidth));
    const h = Math.max(2, Math.round(w * demHeight / demWidth));

    // Máscara del lago para calcular automáticamente la profundidad mínima.
    const maskCanvas = document.createElement("canvas");
    maskCanvas.width = w;
    maskCanvas.height = h;
    const maskCtx = maskCanvas.getContext("2d", { willReadFrequently: true });
    maskCtx.clearRect(0, 0, w, h);
    for (const feature of lagoGeoJSON.features || []) {
        if (!feature.geometry) continue;
        let poligonos = [];
        if (feature.geometry.type === "Polygon") poligonos = [feature.geometry.coordinates];
        else if (feature.geometry.type === "MultiPolygon") poligonos = feature.geometry.coordinates;
        for (const poligono of poligonos) pintarPoligono(maskCtx, poligono, maskCanvas, "rgba(255,255,255,1)");
    }
    const mask = maskCtx.getImageData(0, 0, w, h).data;

    // La elevación se empaqueta en dos canales (16 bits) para conservar precisión.
    // El shader hace interpolación bilineal manual y evita el escalonado/pixelado.
    const heightCanvas = document.createElement("canvas");
    heightCanvas.width = w;
    heightCanvas.height = h;
    const heightCtx = heightCanvas.getContext("2d");
    const img = heightCtx.createImageData(w, h);
    const out = img.data;
    const rango = Math.max(1e-6, elevMax - elevMin);
    let minLago = Infinity;

    for (let y = 0; y < h; y++) {
        const py = Math.round(y / (h - 1) * (demHeight - 1));
        for (let x = 0; x < w; x++) {
            const px = Math.round(x / (w - 1) * (demWidth - 1));
            const z = demRaster[py * demWidth + px];
            const idx = (y * w + x) * 4;
            const valido = valorValido(z);
            const zz = valido ? z : elevMax;
            const norm = THREE.MathUtils.clamp((zz - elevMin) / rango, 0, 1);
            const q = Math.round(norm * 65535);
            out[idx] = (q >> 8) & 255;
            out[idx + 1] = q & 255;
            out[idx + 2] = 0;
            out[idx + 3] = 255;

            if (valido && mask[idx + 3] > 20) minLago = Math.min(minLago, z);
        }
    }
    heightCtx.putImageData(img, 0, 0);

    const texture = new THREE.CanvasTexture(heightCanvas);
    texture.colorSpace = THREE.NoColorSpace;
    texture.minFilter = THREE.NearestFilter;
    texture.magFilter = THREE.NearestFilter;
    texture.generateMipmaps = false;

    if (!Number.isFinite(minLago)) minLago = COTA_LAGO - 400;

    return {
        texture,
        size: new THREE.Vector2(w, h),
        minLagoZ: elevacionAZ(minLago)
    };
}

function fijarNivelAgua(nivelHidraulicoZ) {
    if (!aguaGrupo || !aguaMaterial) return;
    aguaGrupo.position.z = nivelHidraulicoZ + OFFSET_AGUA;
    aguaMaterial.userData.nivelActual = nivelHidraulicoZ;
    const shader = aguaMaterial.userData.shader;
    if (shader?.uniforms?.uWaterLevelZ) shader.uniforms.uWaterLevelZ.value = nivelHidraulicoZ;
}

async function cargarLago() {
    estado.textContent = "Preparando lago…";
    const response = await fetch(RUTA_LAGO);
    if (!response.ok) throw new Error("No se pudo cargar lago2.geojson");
    const geojson = await response.json();

    centroLagoLocal = centroBBoxGeoJSON(geojson);
    const altura = crearTexturaAlturaParaLago(geojson);
    texturaAlturaDEM = altura.texture;

    aguaGrupo = new THREE.Group();
    scene.add(aguaGrupo);

    aguaMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x187fa8,
        transparent: true,
        opacity: 0.80,
        roughness: 0.20,
        metalness: 0.01,
        clearcoat: 0.34,
        clearcoatRoughness: 0.30,
        side: THREE.FrontSide,
        depthWrite: false,
        depthTest: true,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -3,
        alphaToCoverage: true
    });

    // La lámina sigue siendo plana, pero el fragment shader consulta el DEM.
    // Solo dibuja agua donde el fondo está por debajo del nivel actual y crea
    // una transición suave en la orilla. Así el lago realmente se contrae y
    // se expande durante la animación sin cruzarse visualmente con el terreno.
    aguaMaterial.onBeforeCompile = shader => {
        shader.uniforms.uHeightMap = { value: texturaAlturaDEM };
        shader.uniforms.uHeightTexSize = { value: altura.size };
        shader.uniforms.uTerrainSize = { value: new THREE.Vector2(anchoTerreno, altoTerreno) };
        shader.uniforms.uHeightRangeZ = { value: (elevMax - elevMin) * EXAGERACION_VERTICAL };
        shader.uniforms.uWaterLevelZ = { value: Number.isFinite(aguaMaterial.userData.nivelActual) ? aguaMaterial.userData.nivelActual : elevacionAZ(COTA_LAGO) };
        aguaMaterial.userData.shader = shader;

        shader.vertexShader = shader.vertexShader.replace(
            "void main() {",
            `uniform vec2 uTerrainSize;
             varying vec2 vTerrainUv;
             void main() {
                 vTerrainUv = vec2(position.x / uTerrainSize.x + 0.5,
                                   position.y / uTerrainSize.y + 0.5);`
        );

        shader.fragmentShader = shader.fragmentShader.replace(
            "void main() {",
            `uniform sampler2D uHeightMap;
             uniform vec2 uHeightTexSize;
             uniform float uHeightRangeZ;
             uniform float uWaterLevelZ;
             varying vec2 vTerrainUv;

             float decodeHeight16(vec4 c) {
                 float hi = floor(c.r * 255.0 + 0.5);
                 float lo = floor(c.g * 255.0 + 0.5);
                 return (hi * 256.0 + lo) / 65535.0;
             }

             float sampleHeightSmooth(vec2 uv) {
                 vec2 texSize = uHeightTexSize;
                 vec2 p = clamp(uv, vec2(0.0), vec2(1.0)) * texSize - 0.5;
                 vec2 b = floor(p);
                 vec2 f = fract(p);
                 vec2 uv00 = (b + vec2(0.5, 0.5)) / texSize;
                 vec2 uv10 = (b + vec2(1.5, 0.5)) / texSize;
                 vec2 uv01 = (b + vec2(0.5, 1.5)) / texSize;
                 vec2 uv11 = (b + vec2(1.5, 1.5)) / texSize;
                 float h00 = decodeHeight16(texture2D(uHeightMap, clamp(uv00, vec2(0.0), vec2(1.0))));
                 float h10 = decodeHeight16(texture2D(uHeightMap, clamp(uv10, vec2(0.0), vec2(1.0))));
                 float h01 = decodeHeight16(texture2D(uHeightMap, clamp(uv01, vec2(0.0), vec2(1.0))));
                 float h11 = decodeHeight16(texture2D(uHeightMap, clamp(uv11, vec2(0.0), vec2(1.0))));
                 return mix(mix(h00, h10, f.x), mix(h01, h11, f.x), f.y);
             }

             void main() {`
        );

        shader.fragmentShader = shader.fragmentShader.replace(
            "#include <clipping_planes_fragment>",
            `#include <clipping_planes_fragment>
             float terrainZ = sampleHeightSmooth(vTerrainUv) * uHeightRangeZ;
             float waterDepth = uWaterLevelZ - terrainZ;
             float shoreAlpha = smoothstep(2.0, 15.0, waterDepth);
             if (shoreAlpha <= 0.006) discard;
             diffuseColor.a *= shoreAlpha;`
        );
    };
    aguaMaterial.customProgramCacheKey = () => "atitlan-water-bathymetry-v4";

    nivelAguaOriginal = elevacionAZ(COTA_LAGO);
    nivelAguaFinal = altura.minLagoZ - MARGEN_VACIADO_METROS * EXAGERACION_VERTICAL;

    for (const feature of geojson.features || []) {
        if (!feature.geometry) continue;
        let poligonos = [];
        if (feature.geometry.type === "Polygon") poligonos = [feature.geometry.coordinates];
        else if (feature.geometry.type === "MultiPolygon") poligonos = feature.geometry.coordinates;

        for (const poligono of poligonos) {
            const geometry = new THREE.ShapeGeometry(crearShapeLago(poligono));
            const mesh = new THREE.Mesh(geometry, aguaMaterial);
            mesh.renderOrder = 10;
            aguaGrupo.add(mesh);
        }
    }

    fijarNivelAgua(nivelAguaOriginal);
    return geojson;
}

/* ============================================================
   TEXTURA DEL LECHO
   Fuera del lago conserva la geología; dentro queda gris claro.
============================================================ */
async function crearTexturaLecho(canvasGeologia) {
    const response = await fetch(RUTA_LAGO);
    if (!response.ok) throw new Error("No se pudo preparar la máscara del lago");
    const lago = await response.json();

    const canvas = document.createElement("canvas");
    canvas.width = canvasGeologia.width;
    canvas.height = canvasGeologia.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(canvasGeologia, 0, 0);

    for (const feature of lago.features || []) {
        if (!feature.geometry) continue;
        let poligonos = [];
        if (feature.geometry.type === "Polygon") poligonos = [feature.geometry.coordinates];
        else if (feature.geometry.type === "MultiPolygon") poligonos = feature.geometry.coordinates;
        for (const poligono of poligonos) pintarPoligono(ctx, poligono, canvas, "rgb(236,238,239)");
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
}

/* ============================================================
   VACIADO / LLENADO SUAVE

   Ya no se hace bajar la lámina cientos de metros atravesando el DEM.
   Esa intersección era la causa principal del borde pixelado/parpadeante.
   Ahora la transición combina:
   1) desvanecimiento suave del agua,
   2) un descenso visual muy pequeño,
   3) mezcla progresiva de la textura geológica con el lecho.
============================================================ */
function easingAgua(t) {
    // Quintic smoothstep: velocidad cero al principio y al final.
    return t * t * t * (t * (t * 6 - 15) + 10);
}

function animarAgua(vaciar) {
    if (!aguaGrupo || !aguaMaterial || !materialGeologia) return;

    objetivoLagoVacio = vaciar;
    teclaActiva = null;
    const token = ++lakeAnimToken;
    cerrarInfo(false);
    mostrarGaleriaRocas(null);
    marcarBoton("8");

    const inicio = performance.now();
    const nivelInicial = Number.isFinite(aguaMaterial.userData.nivelActual)
        ? aguaMaterial.userData.nivelActual
        : (vaciar ? nivelAguaOriginal : nivelAguaFinal);
    const nivelFinal = vaciar ? nivelAguaFinal : nivelAguaOriginal;
    const mixInicial = lechoMix;
    const mixFinal = vaciar ? 1 : 0;

    // Al llenar desde seco, la lámina comienza por debajo del punto más profundo.
    // El shader la irá haciendo visible primero en las depresiones profundas y
    // luego hacia las orillas conforme asciende.
    aguaGrupo.visible = true;
    aguaMaterial.opacity = 0.80;

    function frame(ahora) {
        if (token !== lakeAnimToken) return;
        const t = Math.min((ahora - inicio) / DURACION_AGUA, 1);
        const s = easingAgua(t);
        const nivel = THREE.MathUtils.lerp(nivelInicial, nivelFinal, s);

        fijarNivelAgua(nivel);
        setLechoMix(THREE.MathUtils.lerp(mixInicial, mixFinal, s));

        const progreso = Math.round(s * 100);
        estado.textContent = vaciar
            ? `Vaciando lago · ${progreso}%`
            : `Llenando lago · ${progreso}%`;

        if (t < 1) {
            requestAnimationFrame(frame);
            return;
        }

        lagoVacio = vaciar;
        objetivoLagoVacio = vaciar;
        fijarNivelAgua(nivelFinal);
        setLechoMix(mixFinal);

        // Al final del vaciado todos los fragmentos ya están descartados por
        // estar por debajo del fondo mínimo. Ocultamos la malla solo entonces.
        if (vaciar) aguaGrupo.visible = false;

        marcarBoton("8");
        estado.textContent = vaciar ? "Lecho del lago visible" : "Lago de Atitlán";
    }

    requestAnimationFrame(frame);
}


/* ============================================================
   GEOMETRÍA: AGRUPAR TODOS LOS FEATURES DE UNA UNIDAD
============================================================ */
function valorProp(props, nombres, fallback = "") {
    for (const n of nombres) {
        const v = props?.[n];
        if (v !== undefined && v !== null && String(v).trim() !== "") return String(v).trim();
    }
    return fallback;
}

function simboloFeature(feature) {
    return valorProp(feature.properties, ["Simbología", "Simbologia", "SIMBOLOGIA", "simbolo", "Símbolo", "Simbolo"]);
}

function featuresDeUnidad(simbolo) {
    return (geologiaGeoJSON?.features || []).filter(f => f.geometry && simboloFeature(f) === simbolo);
}

function poligonosDeFeature(feature) {
    if (!feature?.geometry) return [];
    if (feature.geometry.type === "Polygon") return [feature.geometry.coordinates];
    if (feature.geometry.type === "MultiPolygon") return feature.geometry.coordinates;
    return [];
}

function areaAnillo(ring) {
    let a = 0;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        a += ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
    }
    return Math.abs(a) * 0.5;
}

function puntoEnAnillo(p, ring) {
    let dentro = false;
    const x = p[0], y = p[1];
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        const intersecta = ((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi);
        if (intersecta) dentro = !dentro;
    }
    return dentro;
}

function puntoEnPoligono(p, poligono) {
    if (!puntoEnAnillo(p, poligono[0])) return false;
    for (let i = 1; i < poligono.length; i++) {
        if (puntoEnAnillo(p, poligono[i])) return false;
    }
    return true;
}

function bboxPoligono(poligono) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const ring of poligono) {
        for (const c of ring) {
            minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]);
            minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]);
        }
    }
    return { minX, minY, maxX, maxY, ancho: maxX - minX, alto: maxY - minY };
}

function centroideAnillo(ring) {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const cross = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
        a += cross;
        cx += (ring[j][0] + ring[i][0]) * cross;
        cy += (ring[j][1] + ring[i][1]) * cross;
    }
    if (Math.abs(a) < 1e-9) return ring[Math.floor(ring.length / 2)];
    return [cx / (3 * a), cy / (3 * a)];
}

function dist2Segmento(p, a, b) {
    const vx = b[0] - a[0], vy = b[1] - a[1];
    const wx = p[0] - a[0], wy = p[1] - a[1];
    const c1 = vx * wx + vy * wy;
    if (c1 <= 0) return (p[0]-a[0])**2 + (p[1]-a[1])**2;
    const c2 = vx*vx + vy*vy;
    if (c2 <= c1) return (p[0]-b[0])**2 + (p[1]-b[1])**2;
    const t = c1 / c2;
    const px = a[0] + t*vx, py = a[1] + t*vy;
    return (p[0]-px)**2 + (p[1]-py)**2;
}

function distanciaBorde2(p, poligono) {
    let d2 = Infinity;
    for (const ring of poligono) {
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
            d2 = Math.min(d2, dist2Segmento(p, ring[j], ring[i]));
        }
    }
    return d2;
}

function puntoInteriorRepresentativo(poligono) {
    const bb = bboxPoligono(poligono);
    const centroide = centroideAnillo(poligono[0]);
    if (puntoEnPoligono(centroide, poligono)) return centroide;

    const centroBBox = [(bb.minX + bb.maxX)/2, (bb.minY + bb.maxY)/2];
    if (puntoEnPoligono(centroBBox, poligono)) return centroBBox;

    let mejor = null;
    let mejorD2 = -1;
    const pasos = 24;
    for (let iy = 1; iy < pasos; iy++) {
        const y = bb.minY + (iy / pasos) * bb.alto;
        for (let ix = 1; ix < pasos; ix++) {
            const x = bb.minX + (ix / pasos) * bb.ancho;
            const p = [x, y];
            if (!puntoEnPoligono(p, poligono)) continue;
            const d2 = distanciaBorde2(p, poligono);
            if (d2 > mejorD2) { mejorD2 = d2; mejor = p; }
        }
    }

    if (mejor) return mejor;
    return poligono[0][0];
}

function ejePrincipalPoligono(poligono) {
    const ring = poligono?.[0] || [];
    if (ring.length < 3) return new THREE.Vector2(1, 0);

    let mx = 0, my = 0;
    for (const p of ring) { mx += p[0]; my += p[1]; }
    mx /= ring.length;
    my /= ring.length;

    let sxx = 0, syy = 0, sxy = 0;
    for (const p of ring) {
        const dx = p[0] - mx;
        const dy = p[1] - my;
        sxx += dx * dx;
        syy += dy * dy;
        sxy += dx * dy;
    }

    const angulo = 0.5 * Math.atan2(2 * sxy, sxx - syy);
    const eje = new THREE.Vector2(Math.cos(angulo), Math.sin(angulo));
    if (eje.lengthSq() < 1e-9) eje.set(1, 0);
    return eje.normalize();
}

function datosUnidad(features) {
    const poligonos = [];
    for (const f of features) poligonos.push(...poligonosDeFeature(f));
    if (!poligonos.length) return null;

    let principal = poligonos[0];
    let areaPrincipal = areaAnillo(principal[0]);
    for (const p of poligonos.slice(1)) {
        const a = areaAnillo(p[0]);
        if (a > areaPrincipal) { principal = p; areaPrincipal = a; }
    }

    const bb = bboxPoligono(principal);
    const punto = puntoInteriorRepresentativo(principal);
    const ejePrincipal = ejePrincipalPoligono(principal);
    return {
        ...bb,
        x: punto[0],
        y: punto[1],
        areaPrincipal,
        poligonoPrincipal: principal,
        ejePrincipal
    };
}

/* ============================================================
   ATRIBUTOS Y TEXTO
============================================================ */
function valoresUnicos(features, nombres) {
    const out = [];
    const seen = new Set();
    for (const f of features) {
        const v = valorProp(f.properties, nombres);
        if (!v) continue;
        const key = v.toLowerCase();
        if (!seen.has(key)) { seen.add(key); out.push(v); }
    }
    return out;
}

function tituloUnidad(features, simbolo) {
    const vals = valoresUnicos(features, ["Litología_", "Litologia_", "Litología", "Litologia", "LITOLOGIA"]);
    return vals[0] || `Unidad geológica ${simbolo}`;
}

function descripcionUnidad(features) {
    const vals = valoresUnicos(features, [
        "Descripc_1", "Descripcion_1", "Descripción_1", "Descripc", "Descripcion", "Descripción",
        "DESCRIPCION", "DESCRIPC_1", "Nombre", "NOMBRE"
    ]);
    if (!vals.length) return "";
    return vals.slice(0, 3).join(" ");
}

function normalizarTexto(s) {
    return String(s || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9ñ]+/g, " ")
        .trim();
}

function textosMuyParecidos(a, b) {
    const A = new Set(normalizarTexto(a).split(/\s+/).filter(w => w.length > 4));
    const B = new Set(normalizarTexto(b).split(/\s+/).filter(w => w.length > 4));
    if (!A.size || !B.size) return false;
    let comunes = 0;
    for (const w of A) if (B.has(w)) comunes++;
    return comunes / Math.min(A.size, B.size) > 0.62;
}

function textoGeologicoUnidad(config, features) {
    const base = config.resumen.trim();
    const mapa = descripcionUnidad(features).trim();
    if (!mapa) return base;
    if (textosMuyParecidos(base, mapa)) return base.length >= mapa.length ? base : mapa;
    return `${base}\n\n${mapa}`;
}

const ROCK_ASSET_VERSION = "20261012-r4";

const ROCAS_LEGACY = {
    4: ["Areniscas.png", "areniscas.png", "Arenisca.png", "arenisca.png"],
    5: ["lutita.png", "Lutita.png"],
    6: ["Pizarras.png", "pizarras.png", "Pizarra.png", "pizarra.png"]
};

function urlAssetRoca(nombre) {
    // new URL respeta automáticamente si GitHub Pages está publicado en
    // usuario.github.io/repositorio/ o en un dominio propio.
    return new URL(`data/${nombre}`, document.baseURI).href;
}

function candidatosRoca(numero) {
    const nombres = [
        `${numero}.png`,
        `${numero}.PNG`,
        `${numero}.webp`,
        `${numero}.WEBP`,
        `${numero}.jpg`,
        `${numero}.JPG`,
        `${numero}.jpeg`,
        `${numero}.JPEG`,
        `${numero}.avif`,
        `${numero}.AVIF`,
        ...(ROCAS_LEGACY[numero] || [])
    ];

    return [...new Set(nombres)].map(urlAssetRoca);
}

let promesaCatalogoRocasGithub = null;

function datosRepositorioGithubPages() {
    const host = location.hostname.toLowerCase();
    if (!host.endsWith(".github.io")) return null;

    const owner = host.slice(0, -".github.io".length);
    const partes = location.pathname.split("/").filter(Boolean);

    // En un Project Page la primera carpeta es el nombre del repo.
    // En un User Page la repo es usuario.github.io.
    const repo = partes.length && !partes[0].toLowerCase().endsWith(".html")
        ? partes[0]
        : `${owner}.github.io`;

    return { owner, repo };
}

async function catalogoRocasGithub() {
    if (promesaCatalogoRocasGithub) return promesaCatalogoRocasGithub;

    promesaCatalogoRocasGithub = (async () => {
        const repo = datosRepositorioGithubPages();
        if (!repo) return new Map();

        const mapa = new Map();

        try {
            const api = `https://api.github.com/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.repo)}/contents/data`;
            const r = await fetch(api, {
                cache: "no-store",
                headers: { "Accept": "application/vnd.github+json" }
            });

            if (!r.ok) return mapa;

            const archivos = await r.json();
            if (!Array.isArray(archivos)) return mapa;

            // Se admiten 1.png, 1.PNG, 1.webp, pero también nombres como
            // "1-pomez.png" o "1 pomez.png" por si GitHub los recibió así.
            for (const a of archivos) {
                if (!a || a.type !== "file" || !a.name) continue;

                const m = a.name.match(/^([1-9])(?:$|[._\-\s(])/i);
                if (!m) continue;
                if (!/\.(png|webp|jpe?g|avif)$/i.test(a.name)) continue;

                const n = Number(m[1]);
                if (!mapa.has(n)) mapa.set(n, []);

                // Primero intentamos el archivo publicado por Pages y luego
                // el raw de GitHub como respaldo inmediato tras el commit.
                mapa.get(n).push(urlAssetRoca(a.name));
                if (a.download_url) mapa.get(n).push(a.download_url);
            }
        } catch (err) {
            console.warn("No se pudo consultar la carpeta data/ en GitHub:", err);
        }

        return mapa;
    })();

    return promesaCatalogoRocasGithub;
}

function conVersion(url) {
    try {
        const u = new URL(url, document.baseURI);
        u.searchParams.set("v", ROCK_ASSET_VERSION);
        return u.href;
    } catch {
        const sep = String(url).includes("?") ? "&" : "?";
        return `${url}${sep}v=${ROCK_ASSET_VERSION}`;
    }
}

function probarRutasEnImg(img, rutas, token) {
    return new Promise(resolve => {
        let i = 0;

        const siguiente = () => {
            if (rockGallery.dataset.token !== token || !img.isConnected) {
                resolve(false);
                return;
            }

            if (i >= rutas.length) {
                img.onload = null;
                img.onerror = null;
                resolve(false);
                return;
            }

            const ruta = rutas[i++];
            img.onload = () => {
                img.onload = null;
                img.onerror = null;
                resolve(true);
            };
            img.onerror = siguiente;
            img.src = conVersion(ruta);
        };

        siguiente();
    });
}

async function cargarImagenRoca(img, numero, token) {
    // 1) Nombres exactos esperados.
    let ok = await probarRutasEnImg(img, candidatosRoca(numero), token);
    if (ok) return true;

    // 2) Si estamos en GitHub Pages, descubrir el nombre REAL en data/.
    const mapa = await catalogoRocasGithub();
    if (rockGallery.dataset.token !== token || !img.isConnected) return false;

    const descubiertas = [...new Set(mapa.get(Number(numero)) || [])];
    if (descubiertas.length) {
        ok = await probarRutasEnImg(img, descubiertas, token);
        if (ok) return true;
    }

    console.warn(
        `No se encontró la roca ${numero}.`,
        "Rutas directas:", candidatosRoca(numero),
        "Rutas descubiertas:", descubiertas
    );
    return false;
}

function mostrarGaleriaRocas(tecla = null) {
    const rocas = tecla ? (ROCAS_ESCENA[String(tecla)] || []) : [];

    rockGallery.classList.remove("is-visible");
    rockGallery.setAttribute("aria-hidden", "true");
    rockGallery.replaceChildren();
    rockGallery.dataset.count = String(rocas.length || 0);

    if (!rocas.length) return;

    const token = `${tecla}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    rockGallery.dataset.token = token;
    rockGallery.classList.add("is-visible");
    rockGallery.setAttribute("aria-hidden", "false");

    for (const roca of rocas) {
        const figure = document.createElement("figure");
        figure.className = "rock-sample is-loading";

        const img = document.createElement("img");
        img.alt = `${roca.nombre}, muestra litológica de referencia`;
        img.decoding = "async";
        img.loading = "eager";
        img.draggable = false;

        const caption = document.createElement("figcaption");
        caption.textContent = roca.nombre;

        figure.append(img, caption);
        rockGallery.appendChild(figure);

        cargarImagenRoca(img, roca.n, token).then(ok => {
            if (rockGallery.dataset.token !== token || !figure.isConnected) return;

            figure.classList.remove("is-loading");

            if (ok) {
                figure.classList.remove("is-missing");
                figure.classList.add("is-loaded");
            } else {
                figure.classList.add("is-missing");
                // No dejamos el icono de imagen rota.
                img.remove();
            }
        });
    }
}

   FICHA FUERA DEL MODELO + CALLOUT

function abrirInfo({ codigo, titulo, geologia, edafologia, conCallout = true, seccion1 = "Descripción geológica", seccion2 = "Suelos y vegetación" }) {

    infoSeccion2Titulo.textContent = seccion2;

    document.body.classList.add("info-open");
    infoRail.setAttribute("aria-hidden", "false");
    infoRail.dataset.callout = conCallout ? "1" : "0";
    infoCard.scrollTop = 0;
}

function cerrarInfo(limpiarSeleccion = true) {
    document.body.classList.remove("info-open");
    infoRail.setAttribute("aria-hidden", "true");
    infoRail.dataset.callout = "0";
    puntoCallout3D = null;
    ocultarCallout();
    mostrarGaleriaRocas(null);

    if (limpiarSeleccion) {
        teclaActiva = null;
        marcarBoton(null);
    }
}

document.getElementById("cerrarInfo").addEventListener("click", () => cerrarInfo(true));

function ocultarCallout() {
    calloutLine.style.display = "none";
    calloutHalo.style.display = "none";
    calloutCore.style.display = "none";
}

function mostrarCallout() {
    calloutLine.style.display = "block";
    calloutHalo.style.display = "block";
    calloutCore.style.display = "block";
}

function actualizarCallout() {
    if (!document.body.classList.contains("info-open") || infoRail.dataset.callout !== "1" || !puntoCallout3D) {
        ocultarCallout();
        return;
    }

    const ndc = puntoCallout3D.clone().project(camera);
    if (ndc.z < -1 || ndc.z > 1 || Math.abs(ndc.x) > 1.3 || Math.abs(ndc.y) > 1.3) {
        ocultarCallout();
        return;
    }

    const canvasRect = renderer.domElement.getBoundingClientRect();
    const x = canvasRect.left + (ndc.x * 0.5 + 0.5) * canvasRect.width;
    const y = canvasRect.top + (-ndc.y * 0.5 + 0.5) * canvasRect.height;
    const railRect = infoRail.getBoundingClientRect();
    const cardRect = infoCard.getBoundingClientRect();
    const movil = window.matchMedia("(max-width: 900px)").matches;

    let points;
    if (movil) {
        const endY = railRect.top;
        const endX = THREE.MathUtils.clamp(x, cardRect.left + 34, cardRect.right - 34);
        const elbowY = y + (endY - y) * 0.55;
        points = `${x},${y} ${x},${elbowY} ${endX},${endY}`;
    } else {
        const endX = railRect.left;
        /* Mantener la llegada del callout por debajo de la zona reservada a las rocas. */
        const rockVisible = rockGallery.classList.contains("is-visible");
        const safeTop = rockVisible
            ? Math.max(cardRect.top + 245, window.innerHeight * 0.32)
            : cardRect.top + 70;
        const endY = THREE.MathUtils.clamp(y, safeTop, cardRect.bottom - 70);
        const elbowX = Math.max(x + 28, endX - 38);
        const elbowY = rockVisible && y < safeTop ? safeTop : y;
        points = `${x},${y} ${Math.min(elbowX, endX - 54)},${elbowY} ${endX},${endY}`;
    }

    calloutLine.setAttribute("points", points);
    calloutHalo.setAttribute("cx", x);
    calloutHalo.setAttribute("cy", y);
    calloutCore.setAttribute("cx", x);
    calloutCore.setAttribute("cy", y);
    mostrarCallout();
}

/* ============================================================
   CÁMARA FRONTAL AUTOMÁTICA
   El eje largo de la unidad queda aproximadamente horizontal en
   pantalla y la cámara se coloca perpendicular a ese eje.
============================================================ */
function calcularCamaraFrontal(datos, local, z) {
    const ejeMayor = datos.ejePrincipal.clone().normalize();

    // Una vista verdaderamente "de frente" se consigue mirando de forma
    // aproximadamente perpendicular al eje largo de la unidad.
    let normalUnidad = new THREE.Vector2(-ejeMayor.y, ejeMayor.x).normalize();

    // Elegimos la normal situada DEL LADO DEL LAGO / INTERIOR DE LA CUENCA.
    // Esto reproduce la lectura de tu captura: la cámara se coloca sobre la
    // depresión del lago y mira hacia las paredes/unidades de la cuenca.
    let haciaLago = centroLagoLocal.clone().sub(local);
    if (haciaLago.lengthSq() < 1) haciaLago = new THREE.Vector2(-local.x, -local.y);
    if (haciaLago.lengthSq() < 1) haciaLago.set(0, -1);
    haciaLago.normalize();
    if (normalUnidad.dot(haciaLago) < 0) normalUnidad.multiplyScalar(-1);

    // Conserva el encuadre frontal de la unidad, pero lo orienta ligeramente
    // hacia el centro del lago para que el relieve no quede visto "por detrás".
    const direccionVista = normalUnidad.multiplyScalar(0.74)
        .add(haciaLago.multiplyScalar(0.26))
        .normalize();

    const diagonal = Math.hypot(datos.ancho, datos.alto);
    const extension = Math.max(diagonal, 2600);
    const distancia = THREE.MathUtils.clamp(extension * 1.28, 5900, 23500);

    // Ángulo bajo-oblicuo (aprox. 23–27°), más parecido a una vista frontal
    // de corte/afloramiento que a una vista cenital.
    const horizontal = distancia * 1.02;
    const vertical = THREE.MathUtils.clamp(distancia * 0.43, 2300, 9200);

    const destinoPos = new THREE.Vector3(
        local.x + direccionVista.x * horizontal,
        local.y + direccionVista.y * horizontal,
        z + vertical
    );

    const destinoTarget = new THREE.Vector3(
        local.x,
        local.y,
        z + THREE.MathUtils.clamp(extension * 0.018, 90, 210)
    );

    return { destinoPos, destinoTarget };
}


/* ============================================================
   ESCENA GEOLÓGICA
============================================================ */
function activarEscena(tecla) {
    const config = ESCENAS[tecla];
    if (!config || !geologiaGeoJSON) return;

    if (teclaActiva === tecla && document.body.classList.contains("info-open")) {
        cerrarInfo(true);
        return;
    }

    const features = featuresDeUnidad(config.simbolo);
    if (!features.length) {
        estado.textContent = `No se encontró ${config.simbolo} en geologia.geojson`;
        return;
    }

    const datos = datosUnidad(features);
    if (!datos) return;

    const elevacion = elevacionEnGTM(datos.x, datos.y);
    const z = elevacion !== null
        ? elevacionAZ(elevacion)
        : (elevMax - elevMin) * EXAGERACION_VERTICAL * 0.25;

    const local = gtmALocal(datos.x, datos.y);
    puntoCallout3D = new THREE.Vector3(local.x, local.y, z + 145);
    teclaActiva = tecla;
    marcarBoton(tecla);
    mostrarGaleriaRocas(tecla);

    const { destinoPos, destinoTarget } = calcularCamaraFrontal(datos, local, z);
    animarCamara(destinoPos, destinoTarget);

    const titulo = tituloUnidad(features, config.simbolo);
    abrirInfo({
        codigo: config.simbolo,
        titulo,
        geologia: textoGeologicoUnidad(config, features),
        edafologia: config.edafologia,
        conCallout: true
    });

    estado.textContent = `${config.simbolo} · ${titulo}`;
}


/* ============================================================
   CÁMARA SUAVE, REINICIABLE
============================================================ */
function animarCamara(destinoPos, destinoTarget) {
    const token = ++cameraAnimToken;
    const inicio = performance.now();
    const duracion = 1850;
    const posInicial = camera.position.clone();
    const targetInicial = controls.target.clone();

    function frame(ahora) {
        if (token !== cameraAnimToken) return;
        const t = Math.min((ahora - inicio) / duracion, 1);
        const s = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
        camera.position.lerpVectors(posInicial, destinoPos, s);
        controls.target.lerpVectors(targetInicial, destinoTarget, s);
        controls.update();
        if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
}

controls.addEventListener("start", () => {
    // Si el operador toma el control manual, se cancela la interpolación activa.
    cameraAnimToken++;
});

/* ============================================================
   FLORA / FAUNA PLACEHOLDER
============================================================ */
function mostrarPlaceholder(titulo) {
    mostrarGaleriaRocas(null);
    puntoCallout3D = null;
    teclaActiva = null;
    const tecla = titulo === "Flora" ? "9" : "0";
    marcarBoton(tecla);

    abrirInfo({
        codigo: tecla,
        titulo,
        geologia: titulo === "Flora"
            ? "Esta escena queda reservada para integrar la flora representativa de la Cuenca del Lago de Atitlán, con fotografías, distribución espacial y relaciones con altitud, humedad, exposición y sustrato."
            : "Esta escena queda reservada para integrar la fauna representativa de la Cuenca del Lago de Atitlán, con fotografías, hábitats, distribución espacial y vínculos con la cobertura vegetal y los ambientes acuáticos.",
        edafologia: titulo === "Flora"
            ? "La versión final podrá relacionar especies y comunidades vegetales con la disponibilidad de agua, profundidad del suelo, material parental y condiciones microclimáticas."
            : "La versión final podrá mostrar asociaciones entre fauna, vegetación, relieve, corredores ecológicos, cuerpos de agua y zonas de refugio o alimentación.",
        seccion1: titulo === "Flora" ? "Flora de la cuenca" : "Fauna de la cuenca",
        seccion2: "Próxima integración",
        conCallout: false
    });

    estado.textContent = `${titulo} · módulo pendiente`;
}

/* ============================================================
   TECLADO + BOTONES TÁCTILES
============================================================ */
function ejecutarEscena(tecla) {
    if (ESCENAS[tecla]) {
        activarEscena(tecla);
        return;
    }

    if (tecla === "8") {
        animarAgua(!objetivoLagoVacio);
        return;
    }

    if (tecla === "9") {
        mostrarPlaceholder("Flora");
        return;
    }

    if (tecla === "0") {
        mostrarPlaceholder("Fauna");
    }
}

window.addEventListener("keydown", e => {
    if (e.key === "Escape") {
        cerrarInfo(true);
        return;
    }

    if (/^[0-9]$/.test(e.key)) {
        ejecutarEscena(e.key);
    }
});

for (const btn of sceneButtons) {
    btn.addEventListener("pointerdown", e => e.stopPropagation());
    btn.addEventListener("click", e => {
        e.preventDefault();
        e.stopPropagation();
        ejecutarEscena(btn.dataset.key);
    });
}

/* ============================================================
   RESIZE
============================================================ */
function ajustarRenderer() {
    const w = Math.max(1, stage.clientWidth);
    const h = Math.max(1, stage.clientHeight);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
}

window.addEventListener("resize", ajustarRenderer);
new ResizeObserver(ajustarRenderer).observe(stage);
ajustarRenderer();

/* ============================================================
   LOOP
============================================================ */
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    actualizarCallout();
    renderer.render(scene, camera);
}
animate();

/* ============================================================
   INICIAR
============================================================ */
async function iniciar() {
    try {
        await cargarDEM();
        await cargarGeologia();
        await cargarLago();
        estado.textContent = "Visor listo · teclas 1–7, 8, 9 y 0";
    } catch (error) {
        console.error(error);
        estado.textContent = "ERROR: " + error.message;
    }
}

iniciar();
</script>
