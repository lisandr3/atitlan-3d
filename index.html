  <b>7</b> · Geología<br>

<script type="importmap">
{
  "imports": {
    "three":
    "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

    "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

<script type="module">

import * as THREE from "three";

import {
  OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
  fromUrl
} from "https://cdn.jsdelivr.net/npm/geotiff@2.1.3/+esm";


// ============================================================
// IMPORTANTE: EL MODELO USA Z COMO EJE VERTICAL
// ============================================================

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);


// ============================================================
// ARCHIVOS
// ============================================================

const RUTA_DEM =
  "data/DEM_unificado.tif";

const RUTA_LAGO =
  "data/lago2.geojson";

const RUTA_GEOLOGIA =
  "data/geologia.geojson";

const RUTA_ESTILO_GEOLOGIA =
  "data/geologia.qml";


// ============================================================
// CONFIGURACIÓN
// ============================================================

const EXAGERACION_VERTICAL = 2.0;

// Menor = más ligero.
// 450 ya da bastante detalle.
const COLUMNAS = 450;

// Nivel aproximado del Lago de Atitlán
const COTA_LAGO = 1562;

// Distancia vertical que baja el agua
const PROFUNDIDAD_VACIADO = 700;

// Separación de la geología respecto al DEM
// para evitar parpadeos.
const OFFSET_GEOLOGIA = 10;


// ============================================================
// HTML
// ============================================================

const estado =
  document.getElementById("estado");

const contenedor =
  document.getElementById("visor");


// ============================================================
// ESCENA
// ============================================================

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0xb9ced3);


// ============================================================
// CÁMARA
// ============================================================

const camera =
  new THREE.PerspectiveCamera(
    42,
    window.innerWidth / window.innerHeight,
    1,
    250000
  );

camera.up.set(0, 0, 1);


// ============================================================
// RENDERER
// ============================================================

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

contenedor.appendChild(
  renderer.domElement
);


// ============================================================
// CONTROLES
// ============================================================

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;

controls.dampingFactor = 0.07;

controls.enablePan = true;

controls.screenSpacePanning = false;

// Evita meterse debajo del modelo
controls.maxPolarAngle =
  Math.PI * 0.49;

controls.minDistance = 100;

controls.maxDistance = 150000;


// ============================================================
// ILUMINACIÓN
// ============================================================

const hemi =
  new THREE.HemisphereLight(
    0xffffff,
    0x46515b,
    1.7
  );

scene.add(hemi);


const sol =
  new THREE.DirectionalLight(
    0xffffff,
    2.3
  );

sol.position.set(
  -20000,
  -25000,
  40000
);

scene.add(sol);


// ============================================================
// VARIABLES DEM
// ============================================================

let demRaster = null;

let demWidth = 0;
let demHeight = 0;

let demNoData = null;

let bbox;

let elevMin = Infinity;
let elevMax = -Infinity;

let centroX;
let centroY;

let anchoTerreno;
let altoTerreno;


// ============================================================
// OBJETOS
// ============================================================

let terreno = null;

let aguaGrupo = null;

let geologiaGrupo = null;

let geologiaVisible = true;

let lagoVacio = false;

let animandoAgua = false;

let nivelAguaOriginal = 0;


// ============================================================
// COMPROBAR VALOR DEM
// ============================================================

function valorValido(z) {

  if (!Number.isFinite(z)) {
    return false;
  }

  if (
    demNoData !== null &&
    Number.isFinite(demNoData) &&
    Math.abs(z - demNoData) < 0.001
  ) {
    return false;
  }

  return true;
}


// ============================================================
// OBTENER ELEVACIÓN EN COORDENADA GTM
// ============================================================

function elevacionEnGTM(x, y) {

  if (
    x < bbox[0] ||
    x > bbox[2] ||
    y < bbox[1] ||
    y > bbox[3]
  ) {
    return null;
  }


  const fx =
    (x - bbox[0]) /
    (bbox[2] - bbox[0]) *
    (demWidth - 1);


  const fy =
    (bbox[3] - y) /
    (bbox[3] - bbox[1]) *
    (demHeight - 1);


  const px =
    Math.round(fx);

  const py =
    Math.round(fy);


  // Intento directo

  const indice =
    py * demWidth + px;

  let z =
    demRaster[indice];


  if (valorValido(z)) {
    return z;
  }


  // Si estamos exactamente en el borde de la cuenca,
  // buscamos un píxel vecino válido.

  for (
    let radio = 1;
    radio <= 5;
    radio++
  ) {

    for (
      let dy = -radio;
      dy <= radio;
      dy++
    ) {

      for (
        let dx = -radio;
        dx <= radio;
        dx++
      ) {

        const xx =
          px + dx;

        const yy =
          py + dy;


        if (
          xx < 0 ||
          xx >= demWidth ||
          yy < 0 ||
          yy >= demHeight
        ) {
          continue;
        }


        const valor =
          demRaster[
            yy * demWidth + xx
          ];


        if (valorValido(valor)) {
          return valor;
        }

      }

    }

  }


  return null;
}


// ============================================================
// COORDENADA GTM → ESCENA
// ============================================================

function gtmALocal(x, y) {

  return new THREE.Vector2(
    x - centroX,
    y - centroY
  );
}


// ============================================================
// ELEVACIÓN REAL → Z DE THREE.JS
// ============================================================

function elevacionAZ(z) {

  return (
    z - elevMin
  ) * EXAGERACION_VERTICAL;
}


// ============================================================
// CARGAR DEM
// ============================================================

async function cargarDEM() {

  estado.innerText =
    "Descargando DEM...";


  const tiff =
    await fromUrl(
      RUTA_DEM
    );


  const image =
    await tiff.getImage();


  bbox =
    image.getBoundingBox();


  demWidth =
    image.getWidth();

  demHeight =
    image.getHeight();


  demRaster =
    await image.readRasters({
      interleave: true
    });


  const nodataOriginal =
    image.getGDALNoData();


  demNoData =
    nodataOriginal !== null
      ?
      Number(nodataOriginal)
      :
      null;


  console.log(
    "BBOX DEM:",
    bbox
  );

  console.log(
    "NoData:",
    demNoData
  );


  anchoTerreno =
    bbox[2] - bbox[0];

  altoTerreno =
    bbox[3] - bbox[1];


  centroX =
    (bbox[0] + bbox[2]) / 2;

  centroY =
    (bbox[1] + bbox[3]) / 2;


  // ==========================================================
  // ELEVACIÓN MÍNIMA Y MÁXIMA
  // ==========================================================

  for (
    let i = 0;
    i < demRaster.length;
    i++
  ) {

    const z =
      demRaster[i];


    if (!valorValido(z)) {
      continue;
    }


    elevMin =
      Math.min(
        elevMin,
        z
      );


    elevMax =
      Math.max(
        elevMax,
        z
      );

  }


  console.log(
    "Elevación mínima:",
    elevMin
  );

  console.log(
    "Elevación máxima:",
    elevMax
  );


  estado.innerText =
    "Construyendo cuenca 3D...";


  crearTerreno();


  prepararCamara();


  estado.innerText =
    "Cargando lago...";


  await cargarLago();


  estado.innerText =
    "Cargando geología...";


  await cargarGeologia();


  estado.innerText =
    "Visor listo";

}


// ============================================================
// CREAR TERRENO SIN NODATA
// ============================================================

function crearTerreno() {

  const filas =
    Math.round(
      COLUMNAS *
      demHeight /
      demWidth
    );


  const posiciones = [];

  const validos = [];

  const alturas = [];


  // ==========================================================
  // CREAR MALLA DE PUNTOS
  // ==========================================================

  for (
    let fila = 0;
    fila < filas;
    fila++
  ) {

    const py =
      Math.round(
        fila /
        (filas - 1) *
        (demHeight - 1)
      );


    const mapY =
      bbox[3] -
      fila /
      (filas - 1) *
      altoTerreno;


    const localY =
      mapY - centroY;


    for (
      let col = 0;
      col < COLUMNAS;
      col++
    ) {

      const px =
        Math.round(
          col /
          (COLUMNAS - 1) *
          (demWidth - 1)
        );


      const mapX =
        bbox[0] +
        col /
        (COLUMNAS - 1) *
        anchoTerreno;


      const localX =
        mapX - centroX;


      const valor =
        demRaster[
          py * demWidth + px
        ];


      const valido =
        valorValido(valor);


      validos.push(
        valido
      );


      alturas.push(
        valido
          ?
          elevacionAZ(valor)
          :
          0
      );


      posiciones.push(
        localX,
        localY,
        valido
          ?
          elevacionAZ(valor)
          :
          0
      );

    }

  }


  // ==========================================================
  // CREAR SOLO TRIÁNGULOS VÁLIDOS
  // ==========================================================

  const indices = [];


  for (
    let fila = 0;
    fila < filas - 1;
    fila++
  ) {

    for (
      let col = 0;
      col < COLUMNAS - 1;
      col++
    ) {

      const a =
        fila * COLUMNAS +
        col;

      const b =
        a + 1;

      const c =
        (fila + 1) *
        COLUMNAS +
        col;

      const d =
        c + 1;


      // triángulo 1
      if (
        validos[a] &&
        validos[c] &&
        validos[b]
      ) {

        indices.push(
          a,
          c,
          b
        );

      }


      // triángulo 2
      if (
        validos[b] &&
        validos[c] &&
        validos[d]
      ) {

        indices.push(
          b,
          c,
          d
        );

      }

    }

  }


  const geometry =
    new THREE.BufferGeometry();


  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      posiciones,
      3
    )
  );


  geometry.setIndex(
    indices
  );


  geometry.computeVertexNormals();


  const material =
    new THREE.MeshStandardMaterial({

      color:
        0x7b7ea5,

      roughness:
        0.88,

      metalness:
        0,

      side:
        THREE.DoubleSide

    });


  terreno =
    new THREE.Mesh(
      geometry,
      material
    );


  scene.add(
    terreno
  );


  console.log(
    "Triángulos terreno:",
    indices.length / 3
  );

}


// ============================================================
// CÁMARA
// ============================================================

function prepararCamara() {

  const maxDim =
    Math.max(
      anchoTerreno,
      altoTerreno
    );


  camera.position.set(
    maxDim * 0.55,
    -maxDim * 0.72,
    maxDim * 0.55
  );


  controls.target.set(
    0,
    0,
    (
      elevMax -
      elevMin
    ) *
    EXAGERACION_VERTICAL *
    0.18
  );


  controls.update();
}


// ============================================================
// CREAR SHAPE DESDE POLÍGONO
// ============================================================

function crearShape(poligono) {

  const exterior =
    poligono[0].map(
      c =>
        gtmALocal(
          c[0],
          c[1]
        )
    );


  const shape =
    new THREE.Shape();


  shape.moveTo(
    exterior[0].x,
    exterior[0].y
  );


  for (
    let i = 1;
    i < exterior.length;
    i++
  ) {

    shape.lineTo(
      exterior[i].x,
      exterior[i].y
    );

  }


  // Huecos
  for (
    let h = 1;
    h < poligono.length;
    h++
  ) {

    const coords =
      poligono[h].map(
        c =>
          gtmALocal(
            c[0],
            c[1]
          )
      );


    const hole =
      new THREE.Path();


    hole.moveTo(
      coords[0].x,
      coords[0].y
    );


    for (
      let i = 1;
      i < coords.length;
      i++
    ) {

      hole.lineTo(
        coords[i].x,
        coords[i].y
      );

    }


    shape.holes.push(
      hole
    );

  }


  return shape;
}


// ============================================================
// LAGO
// ============================================================

async function cargarLago() {

  const response =
    await fetch(
      RUTA_LAGO
    );


  if (!response.ok) {

    throw new Error(
      "No se encontró lago2.geojson"
    );

  }


  const geojson =
    await response.json();


  aguaGrupo =
    new THREE.Group();


  scene.add(
    aguaGrupo
  );


  const material =
    new THREE.MeshPhysicalMaterial({

      color:
        0x147fa9,

      transparent:
        true,

      opacity:
        0.82,

      roughness:
        0.15,

      metalness:
        0.03,

      transmission:
        0.08,

      side:
        THREE.DoubleSide

    });


  nivelAguaOriginal =
    elevacionAZ(
      COTA_LAGO
    ) + 5;


  aguaGrupo.position.z =
    nivelAguaOriginal;


  for (
    const feature
    of geojson.features
  ) {

    if (!feature.geometry) {
      continue;
    }


    let poligonos = [];


    if (
      feature.geometry.type ===
      "Polygon"
    ) {

      poligonos = [
        feature.geometry.coordinates
      ];

    }


    else if (
      feature.geometry.type ===
      "MultiPolygon"
    ) {

      poligonos =
        feature.geometry.coordinates;

    }


    for (
      const poligono
      of poligonos
    ) {

      const shape =
        crearShape(
          poligono
        );


      const geometry =
        new THREE.ShapeGeometry(
          shape
        );


      const mesh =
        new THREE.Mesh(
          geometry,
          material
        );


      aguaGrupo.add(
        mesh
      );

    }

  }

}


// ============================================================
// LEER COLOR QGIS
// ============================================================

function colorQgisAThree(valor) {

  if (!valor) {
    return new THREE.Color(0xcccccc);
  }


  const partes =
    valor
      .split(",")
      .map(Number);


  if (
    partes.length >= 3
  ) {

    return new THREE.Color(
      partes[0] / 255,
      partes[1] / 255,
      partes[2] / 255
    );

  }


  try {

    return new THREE.Color(
      valor
    );

  }
  catch {

    return new THREE.Color(
      0xcccccc
    );

  }

}


// ============================================================
// LEER ESTILO .QML
// ============================================================

async function cargarEstiloQML() {

  const response =
    await fetch(
      RUTA_ESTILO_GEOLOGIA
    );


  if (!response.ok) {

    console.warn(
      "No se encontró geologia.qml"
    );

    return null;
  }


  const texto =
    await response.text();


  const xml =
    new DOMParser()
      .parseFromString(
        texto,
        "text/xml"
      );


  const rendererQgis =
    xml.querySelector(
      "renderer-v2"
    );


  if (!rendererQgis) {
    return null;
  }


  const campo =
    rendererQgis.getAttribute(
      "attr"
    );


  const coloresPorSimbolo =
    new Map();


  // ----------------------------------------------------------
  // símbolos QGIS
  // ----------------------------------------------------------

  const simbolos =
    xml.querySelectorAll(
      "symbols > symbol"
    );


  simbolos.forEach(
    simbolo => {

      const id =
        simbolo.getAttribute(
          "name"
        );


      let color = null;


      const opciones =
        simbolo.querySelectorAll(
          "Option"
        );


      opciones.forEach(
        opcion => {

          if (
            opcion.getAttribute(
              "name"
            ) === "color"
          ) {

            const value =
              opcion.getAttribute(
                "value"
              );


            if (value) {
              color = value;
            }

          }

        }
      );


      if (color) {

        coloresPorSimbolo.set(
          id,
          color
        );

      }

    }
  );


  // ----------------------------------------------------------
  // categorías
  // ----------------------------------------------------------

  const categorias =
    new Map();


  xml
    .querySelectorAll(
      "categories > category"
    )
    .forEach(
      categoria => {

        const valor =
          categoria.getAttribute(
            "value"
          );

        const simbolo =
          categoria.getAttribute(
            "symbol"
          );


        if (
          coloresPorSimbolo.has(
            simbolo
          )
        ) {

          categorias.set(
            String(valor),
            coloresPorSimbolo.get(
              simbolo
            )
          );

        }

      }
    );


  console.log(
    "Campo geología QML:",
    campo
  );


  console.log(
    "Categorías geología:",
    categorias
  );


  return {
    campo,
    categorias,
    coloresPorSimbolo
  };
}


// ============================================================
// DRAPEAR GEOMETRÍA SOBRE DEM
// ============================================================

function drapearGeometria(
  geometry
) {

  const original =
    geometry.index
      ?
      geometry.toNonIndexed()
      :
      geometry;


  const pos =
    original.attributes.position;


  const nuevasPosiciones = [];


  // ShapeGeometry contiene triángulos consecutivos
  for (
    let i = 0;
    i < pos.count;
    i += 3
  ) {

    const triangulo = [];

    let valido = true;


    for (
      let j = 0;
      j < 3;
      j++
    ) {

      const indice =
        i + j;


      const localX =
        pos.getX(indice);

      const localY =
        pos.getY(indice);


      const gtmX =
        localX +
        centroX;


      const gtmY =
        localY +
        centroY;


      const zReal =
        elevacionEnGTM(
          gtmX,
          gtmY
        );


      if (
        zReal === null
      ) {

        valido = false;
        break;

      }


      triangulo.push(
        localX,
        localY,
        elevacionAZ(zReal) +
        OFFSET_GEOLOGIA
      );

    }


    if (valido) {

      nuevasPosiciones.push(
        ...triangulo
      );

    }

  }


  const resultado =
    new THREE.BufferGeometry();


  resultado.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      nuevasPosiciones,
      3
    )
  );


  resultado.computeVertexNormals();


  return resultado;
}


// ============================================================
// GEOLOGÍA
// ============================================================

async function cargarGeologia() {

  const [
    respuestaGeoJSON,
    estilo
  ] =
    await Promise.all([

      fetch(
        RUTA_GEOLOGIA
      ),

      cargarEstiloQML()

    ]);


  if (!respuestaGeoJSON.ok) {

    console.warn(
      "No se encontró geologia.geojson"
    );

    return;
  }


  const geojson =
    await respuestaGeoJSON.json();


  console.log(
    "Geología:",
    geojson
  );


  geologiaGrupo =
    new THREE.Group();


  geologiaGrupo.name =
    "Geologia";


  scene.add(
    geologiaGrupo
  );


  for (
    const feature
    of geojson.features
  ) {

    if (!feature.geometry) {
      continue;
    }


    let poligonos = [];


    if (
      feature.geometry.type ===
      "Polygon"
    ) {

      poligonos = [
        feature.geometry.coordinates
      ];

    }


    else if (
      feature.geometry.type ===
      "MultiPolygon"
    ) {

      poligonos =
        feature.geometry.coordinates;

    }


    else {

      continue;
    }


    // ========================================================
    // COLOR DE LA CATEGORÍA QGIS
    // ========================================================

    let color =
      new THREE.Color(
        0xd9b98c
      );


    if (
      estilo &&
      estilo.campo
    ) {

      const valor =
        String(
          feature.properties?.[
            estilo.campo
          ] ?? ""
        );


      const colorQml =
        estilo.categorias.get(
          valor
        );


      if (colorQml) {

        color =
          colorQgisAThree(
            colorQml
          );

      }

    }


    const material =
      new THREE.MeshStandardMaterial({

        color: color,

        transparent: true,

        opacity: 0.78,

        roughness: 0.9,

        metalness: 0,

        side:
          THREE.DoubleSide,

        polygonOffset: true,

        polygonOffsetFactor: -2,

        polygonOffsetUnits: -2

      });


    for (
      const poligono
      of poligonos
    ) {

      const shape =
        crearShape(
          poligono
        );


      const plana =
        new THREE.ShapeGeometry(
          shape
        );


      const geometry =
        drapearGeometria(
          plana
        );


      if (
        geometry.attributes.position.count === 0
      ) {
        continue;
      }


      const mesh =
        new THREE.Mesh(
          geometry,
          material
        );


      mesh.userData =
        feature.properties;


      geologiaGrupo.add(
        mesh
      );

    }

  }


  console.log(
    "Polígonos geología cargados:",
    geologiaGrupo.children.length
  );

}


// ============================================================
// VACIAR / LLENAR LAGO
// ============================================================

function animarAgua(
  vaciar
) {

  if (
    !aguaGrupo ||
    animandoAgua
  ) {
    return;
  }


  animandoAgua = true;


  const inicio =
    performance.now();


  const zInicial =
    aguaGrupo.position.z;


  const zFinal =
    vaciar
      ?
      nivelAguaOriginal -
      PROFUNDIDAD_VACIADO *
      EXAGERACION_VERTICAL
      :
      nivelAguaOriginal;


  estado.innerText =
    vaciar
      ?
      "Vaciando Lago de Atitlán..."
      :
      "Llenando Lago de Atitlán...";


  function paso(ahora) {

    const t =
      Math.min(
        (
          ahora -
          inicio
        ) / 2500,
        1
      );


    const suave =
      t < 0.5
        ?
        2 * t * t
        :
        1 -
        Math.pow(
          -2 * t + 2,
          2
        ) / 2;


    aguaGrupo.position.z =
      THREE.MathUtils.lerp(
        zInicial,
        zFinal,
        suave
      );


    aguaGrupo.traverse(
      obj => {

        if (
          obj.isMesh &&
          obj.material
        ) {

          obj.material.opacity =
            vaciar
              ?
              THREE.MathUtils.lerp(
                0.82,
                0.08,
                suave
              )
              :
              THREE.MathUtils.lerp(
                0.08,
                0.82,
                suave
              );

        }

      }
    );


    if (t < 1) {

      requestAnimationFrame(
        paso
      );

    }

    else {

      lagoVacio =
        vaciar;

      animandoAgua =
        false;


      estado.innerText =
        lagoVacio
          ?
          "Lago vacío · batimetría visible"
          :
          "Lago lleno";

    }

  }


  requestAnimationFrame(
    paso
  );

}


// ============================================================
// TECLADO
// ============================================================

window.addEventListener(
  "keydown",
  e => {

    // GEOLOGÍA
    if (
      e.code === "Digit7" ||
      e.code === "Numpad7"
    ) {

      if (geologiaGrupo) {

        geologiaVisible =
          !geologiaVisible;


        geologiaGrupo.visible =
          geologiaVisible;


        estado.innerText =
          geologiaVisible
            ?
            "Geología visible"
            :
            "Geología oculta";

      }

    }


    // LAGO
    if (
      e.code === "Digit8" ||
      e.code === "Numpad8"
    ) {

      animarAgua(
        !lagoVacio
      );

    }

  }
);


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// ============================================================
// ANIMACIÓN
// ============================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();


// ============================================================
// INICIAR
// ============================================================

cargarDEM()
  .catch(
    error => {

      console.error(
        error
      );


      estado.innerText =
        "ERROR: " +
        error.message;

    }
  );

</script>
