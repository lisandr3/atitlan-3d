<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cuenca del Lago de Atitlán - Visor 3D</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9ced3;
      font-family: Arial, sans-serif;
    }

    #visor {
      width: 100%;
      height: 100%;
    }

    #panel {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;
      color: white;
      background: rgba(0, 0, 0, 0.58);
      padding: 14px 18px;
      border-radius: 10px;
    }

    #panel h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
    }

    #estado {
      font-size: 14px;
    }

    #ayuda {
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.85;
    }

    #tecla8 {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      color: white;
      background: rgba(0, 0, 0, 0.55);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="panel">
  <h2>Cuenca del Lago de Atitlán</h2>
  <div id="estado">Cargando modelo 3D...</div>
  <div id="ayuda">Arrastrar: rotar · rueda: zoom</div>
</div>

<div id="tecla8">
  Tecla 8 · Vaciar / llenar lago
</div>

<div id="visor"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// --------------------------------------------------
// RUTAS
// --------------------------------------------------

const RUTA_MODELO = "data/MODELO5.gltf";
const RUTA_LAGO = "data/lago2.geojson";

// --------------------------------------------------
// EXTENSIÓN DEL DEM EN GTM
// --------------------------------------------------
// Si luego vemos que el lago queda desplazado,
// ajustamos estos cuatro valores.

const DEM_MIN_X = 412522.0215;
const DEM_MAX_X = 436267.0215;

const DEM_MIN_Y = 1612622.4743;
const DEM_MAX_Y = 1646342.4743;

// --------------------------------------------------
// ESCENA
// --------------------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xb9ced3);

// --------------------------------------------------
// CÁMARA
// --------------------------------------------------

const camera = new THREE.PerspectiveCamera(
  42,
  window.innerWidth / window.innerHeight,
  1,
  500000
);

// --------------------------------------------------
// RENDERER
// --------------------------------------------------

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.getElementById("visor")
  .appendChild(renderer.domElement);

// --------------------------------------------------
// CONTROLES
// --------------------------------------------------

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

// --------------------------------------------------
// LUCES
// --------------------------------------------------

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x445566,
    1.6
  )
);

const sol = new THREE.DirectionalLight(
  0xffffff,
  2.2
);

sol.position.set(
  -25000,
  30000,
  25000
);

scene.add(sol);

// --------------------------------------------------
// VARIABLES
// --------------------------------------------------

const estado = document.getElementById("estado");

let modelo = null;
let aguaGrupo = null;

let lagoVacio = false;
let animando = false;

let nivelAguaOriginal = 0;

let cajaModelo;
let tamañoModelo;
let centroModelo;

// --------------------------------------------------
// CARGAR MODELO
// --------------------------------------------------

const loader = new GLTFLoader();

loader.load(

  RUTA_MODELO,

  async gltf => {

    modelo = gltf.scene;

    scene.add(modelo);

    modelo.updateMatrixWorld(true);

    cajaModelo =
      new THREE.Box3().setFromObject(modelo);

    tamañoModelo =
      new THREE.Vector3();

    centroModelo =
      new THREE.Vector3();

    cajaModelo.getSize(tamañoModelo);

    cajaModelo.getCenter(centroModelo);

    console.log(
      "Centro modelo:",
      centroModelo
    );

    console.log(
      "Tamaño modelo:",
      tamañoModelo
    );

    // Cámara inicial

    const maxDim =
      Math.max(
        tamañoModelo.x,
        tamañoModelo.z
      );

    camera.position.set(
      centroModelo.x + maxDim * 0.55,
      centroModelo.y + maxDim * 0.45,
      centroModelo.z + maxDim * 0.8
    );

    controls.target.copy(
      centroModelo
    );

    controls.update();

    estado.innerText =
      "Modelo cargado · preparando lago...";

    await cargarLago();

  },

  xhr => {

    if (xhr.total) {

      const p =
        Math.round(
          xhr.loaded /
          xhr.total *
          100
        );

      estado.innerText =
        "Cargando modelo: " +
        p +
        "%";
    }

  },

  error => {

    console.error(error);

    estado.innerText =
      "ERROR cargando MODELO5.gltf";
  }
);

// --------------------------------------------------
// CONVERTIR COORDENADA GTM AL ESPACIO DEL GLTF
// --------------------------------------------------

function coordModelo(x, y) {

  const nx =
    (x - DEM_MIN_X) /
    (DEM_MAX_X - DEM_MIN_X);

  const ny =
    (y - DEM_MIN_Y) /
    (DEM_MAX_Y - DEM_MIN_Y);

  const mx =
    cajaModelo.min.x +
    nx * tamañoModelo.x;

  const mz =
    cajaModelo.max.z -
    ny * tamañoModelo.z;

  return new THREE.Vector2(
    mx,
    mz
  );
}

// --------------------------------------------------
// CARGAR LAGO
// --------------------------------------------------

async function cargarLago() {

  const respuesta =
    await fetch(
      RUTA_LAGO
    );

  if (!respuesta.ok) {

    estado.innerText =
      "ERROR cargando lago2.geojson";

    throw new Error(
      "No se pudo cargar lago2.geojson"
    );
  }

  const geojson =
    await respuesta.json();

  console.log(
    "GeoJSON lago:",
    geojson
  );

  aguaGrupo =
    new THREE.Group();

  scene.add(
    aguaGrupo
  );

  const materialAgua =
    new THREE.MeshPhysicalMaterial({

      color: 0x157fa8,

      transparent: true,

      opacity: 0.78,

      roughness: 0.12,

      metalness: 0.03,

      transmission: 0.08,

      side: THREE.DoubleSide,

      depthWrite: true
    });

  // --------------------------------------------------
  // CREAR POLÍGONOS
  // --------------------------------------------------

  for (
    const feature
    of geojson.features
  ) {

    if (
      !feature.geometry
    ) {
      continue;
    }

    let poligonos = [];

    if (
      feature.geometry.type ===
      "Polygon"
    ) {

      poligonos = [
        feature.geometry.coordinates
      ];

    }

    else if (
      feature.geometry.type ===
      "MultiPolygon"
    ) {

      poligonos =
        feature.geometry.coordinates;

    }

    else {

      continue;
    }

    for (
      const poligono
      of poligonos
    ) {

      const exterior =
        poligono[0].map(
          c =>
            coordModelo(
              c[0],
              c[1]
            )
        );

      const shape =
        new THREE.Shape();

      shape.moveTo(
        exterior[0].x,
        exterior[0].y
      );

      for (
        let i = 1;
        i < exterior.length;
        i++
      ) {

        shape.lineTo(
          exterior[i].x,
          exterior[i].y
        );
      }

      // Huecos interiores

      if (
        poligono.length > 1
      ) {

        for (
          let h = 1;
          h < poligono.length;
          h++
        ) {

          const hueco =
            poligono[h].map(
              c =>
                coordModelo(
                  c[0],
                  c[1]
                )
            );

          const path =
            new THREE.Path();

          path.moveTo(
            hueco[0].x,
            hueco[0].y
          );

          for (
            let i = 1;
            i < hueco.length;
            i++
          ) {

            path.lineTo(
              hueco[i].x,
              hueco[i].y
            );
          }

          shape.holes.push(
            path
          );
        }
      }

      const geometria =
        new THREE.ShapeGeometry(
          shape
        );

      // ShapeGeometry nace en XY.
      // Lo pasamos a plano XZ.

      geometria.rotateX(
        Math.PI / 2
      );

      const agua =
        new THREE.Mesh(
          geometria,
          materialAgua
        );

      aguaGrupo.add(
        agua
      );
    }
  }

  // --------------------------------------------------
  // CALCULAR NIVEL DEL LAGO AUTOMÁTICAMENTE
  // --------------------------------------------------

  const raycaster =
    new THREE.Raycaster();

  const muestrasY = [];

  for (
    const feature
    of geojson.features
  ) {

    let anillos = [];

    if (
      feature.geometry.type ===
      "Polygon"
    ) {

      anillos = [
        feature.geometry.coordinates[0]
      ];

    }

    else if (
      feature.geometry.type ===
      "MultiPolygon"
    ) {

      anillos =
        feature.geometry.coordinates.map(
          p => p[0]
        );

    }

    for (
      const anillo
      of anillos
    ) {

      const salto =
        Math.max(
          1,
          Math.floor(
            anillo.length /
            80
          )
        );

      for (
        let i = 0;
        i < anillo.length;
        i += salto
      ) {

        const c =
          coordModelo(
            anillo[i][0],
            anillo[i][1]
          );

        const origen =
          new THREE.Vector3(
            c.x,
            cajaModelo.max.y + 10000,
            c.y
          );

        raycaster.set(
          origen,
          new THREE.Vector3(
            0,
            -1,
            0
          )
        );

        const hits =
          raycaster.intersectObject(
            modelo,
            true
          );

        if (
          hits.length > 0
        ) {

          muestrasY.push(
            hits[0].point.y
          );
        }
      }
    }
  }

  console.log(
    "Muestras de borde:",
    muestrasY.length
  );

  if (
    muestrasY.length > 0
  ) {

    muestrasY.sort(
      (a, b) =>
        a - b
    );

    nivelAguaOriginal =
      muestrasY[
        Math.floor(
          muestrasY.length /
          2
        )
      ] + 4;
  }

  else {

    nivelAguaOriginal =
      cajaModelo.min.y +
      tamañoModelo.y * 0.35;
  }

  aguaGrupo.position.y =
    nivelAguaOriginal;

  console.log(
    "Nivel agua:",
    nivelAguaOriginal
  );

  estado.innerText =
    "Lago cargado · pulsa 8 para vaciar";
}

// --------------------------------------------------
// ANIMACIÓN DEL AGUA
// --------------------------------------------------

function animarAgua(
  vaciar
) {

  if (
    !aguaGrupo ||
    animando
  ) {
    return;
  }

  animando = true;

  const inicio =
    performance.now();

  const yInicial =
    aguaGrupo.position.y;

  const profundidad =
    tamañoModelo.y *
    0.75;

  const yFinal =
    vaciar
      ?
      nivelAguaOriginal -
      profundidad
      :
      nivelAguaOriginal;

  estado.innerText =
    vaciar
      ?
      "Vaciando lago..."
      :
      "Llenando lago...";

  function paso(
    ahora
  ) {

    const t =
      Math.min(
        (
          ahora -
          inicio
        ) /
        2500,
        1
      );

    const suave =
      t < 0.5
        ?
        2 * t * t
        :
        1 -
        Math.pow(
          -2 * t + 2,
          2
        ) / 2;

    aguaGrupo.position.y =
      THREE.MathUtils.lerp(
        yInicial,
        yFinal,
        suave
      );

    aguaGrupo.traverse(
      obj => {

        if (
          obj.isMesh &&
          obj.material
        ) {

          obj.material.opacity =
            vaciar
              ?
              THREE.MathUtils.lerp(
                0.78,
                0.05,
                suave
              )
              :
              THREE.MathUtils.lerp(
                0.05,
                0.78,
                suave
              );
        }
      }
    );

    if (
      t < 1
    ) {

      requestAnimationFrame(
        paso
      );

    }

    else {

      lagoVacio =
        vaciar;

      animando =
        false;

      estado.innerText =
        lagoVacio
          ?
          "Lago vacío · batimetría visible"
          :
          "Lago lleno · pulsa 8 para vaciar";
    }
  }

  requestAnimationFrame(
    paso
  );
}

// --------------------------------------------------
// TECLA 8
// --------------------------------------------------

window.addEventListener(
  "keydown",
  e => {

    if (
      e.code ===
      "Digit8" ||
      e.code ===
      "Numpad8"
    ) {

      animarAgua(
        !lagoVacio
      );
    }
  }
);

// --------------------------------------------------
// RESIZE
// --------------------------------------------------

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

// --------------------------------------------------
// LOOP
// --------------------------------------------------

function animate() {

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();

</script>

</body>
</html>
