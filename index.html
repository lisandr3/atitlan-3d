<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cuenca del Lago de Atitlán - Visor 3D</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9ced3;
      font-family: Arial, sans-serif;
    }

    #visor {
      width: 100%;
      height: 100%;
    }

    #panel {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;

      color: white;
      background: rgba(0,0,0,0.58);

      padding: 14px 18px;
      border-radius: 10px;
    }

    #panel h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
    }

    #estado {
      font-size: 14px;
    }

    #ayuda {
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.85;
    }

    #tecla8 {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 10;

      color: white;
      background: rgba(0,0,0,0.55);

      padding: 12px 16px;
      border-radius: 8px;

      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="panel">
  <h2>Cuenca del Lago de Atitlán</h2>
  <div id="estado">Cargando DEM...</div>
  <div id="ayuda">
    Arrastrar: rotar · rueda: zoom
  </div>
</div>

<div id="tecla8">
  Tecla 8 · Vaciar / llenar lago
</div>

<div id="visor"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import {
  OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
  fromUrl
} from "https://cdn.jsdelivr.net/npm/geotiff@2.1.3/+esm";


// ==================================================
// RUTAS
// ==================================================

const RUTA_DEM =
  "data/DEM_unificado.tif";

const RUTA_LAGO =
  "data/lago2.geojson";


// ==================================================
// CONFIGURACIÓN
// ==================================================

const EXAGERACION_VERTICAL = 2.0;

// resolución web del terreno
const COLUMNAS = 420;

// altura aproximada del lago Atitlán
const COTA_LAGO = 1562;

// cuánto baja el lago
const PROFUNDIDAD_VACIADO = 600;


// ==================================================
// ESCENA
// ==================================================

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(
    0xb9ced3
  );


// ==================================================
// CÁMARA
// ==================================================

const camera =
  new THREE.PerspectiveCamera(
    42,
    window.innerWidth /
    window.innerHeight,
    1,
    200000
  );


// ==================================================
// RENDERER
// ==================================================

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

document
  .getElementById("visor")
  .appendChild(
    renderer.domElement
  );


// ==================================================
// CONTROLES
// ==================================================

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;

controls.dampingFactor = 0.06;


// ==================================================
// LUCES
// ==================================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x445566,
    1.7
  )
);

const sol =
  new THREE.DirectionalLight(
    0xffffff,
    2.0
  );

sol.position.set(
  -20000,
  -30000,
  35000
);

scene.add(sol);


// ==================================================
// VARIABLES
// ==================================================

const estado =
  document.getElementById(
    "estado"
  );

let terreno = null;

let aguaGrupo = null;

let lagoVacio = false;

let animando = false;

let nivelAguaOriginal = 0;


// información del DEM
let bbox;

let elevMin;
let elevMax;

let anchoTerreno;
let altoTerreno;

let centroX;
let centroY;


// ==================================================
// CARGAR DEM
// ==================================================

async function cargarDEM() {

  estado.innerText =
    "Descargando DEM...";


  const tiff =
    await fromUrl(
      RUTA_DEM
    );


  const image =
    await tiff.getImage();


  bbox =
    image.getBoundingBox();


  console.log(
    "BBOX DEM:",
    bbox
  );


  const widthOriginal =
    image.getWidth();

  const heightOriginal =
    image.getHeight();


  const raster =
    await image.readRasters({
      interleave: true
    });


  const noData =
    image.getGDALNoData();


  console.log(
    "NoData:",
    noData
  );


  anchoTerreno =
    bbox[2] - bbox[0];

  altoTerreno =
    bbox[3] - bbox[1];


  centroX =
    (bbox[0] + bbox[2]) / 2;

  centroY =
    (bbox[1] + bbox[3]) / 2;


  const filas =
    Math.round(
      COLUMNAS *
      heightOriginal /
      widthOriginal
    );


  estado.innerText =
    "Construyendo terreno 3D...";


  // ==================================================
  // CALCULAR ELEVACIONES
  // ==================================================

  elevMin = Infinity;
  elevMax = -Infinity;


  for (
    let y = 0;
    y < heightOriginal;
    y += 5
  ) {

    for (
      let x = 0;
      x < widthOriginal;
      x += 5
    ) {

      const indice =
        y *
        widthOriginal +
        x;


      const z =
        raster[indice];


      if (
        Number.isFinite(z) &&
        z !== noData &&
        z > -1000 &&
        z < 10000
      ) {

        elevMin =
          Math.min(
            elevMin,
            z
          );

        elevMax =
          Math.max(
            elevMax,
            z
          );

      }

    }

  }


  console.log(
    "Elevación mínima:",
    elevMin
  );

  console.log(
    "Elevación máxima:",
    elevMax
  );


  // ==================================================
  // GEOMETRÍA
  // ==================================================

  const geometry =
    new THREE.PlaneGeometry(
      anchoTerreno,
      altoTerreno,
      COLUMNAS - 1,
      filas - 1
    );


  const posiciones =
    geometry.attributes.position;


  for (
    let i = 0;
    i < posiciones.count;
    i++
  ) {

    const col =
      i % COLUMNAS;

    const fila =
      Math.floor(
        i / COLUMNAS
      );


    const px =
      Math.round(
        col /
        (COLUMNAS - 1) *
        (widthOriginal - 1)
      );


    const py =
      Math.round(
        fila /
        (filas - 1) *
        (heightOriginal - 1)
      );


    const indice =
      py *
      widthOriginal +
      px;


    let z =
      raster[indice];


    if (
      !Number.isFinite(z) ||
      z === noData ||
      z < -1000 ||
      z > 10000
    ) {

      z = elevMin;

    }


    posiciones.setZ(
      i,
      (
        z -
        elevMin
      ) *
      EXAGERACION_VERTICAL
    );

  }


  geometry.computeVertexNormals();


  // ==================================================
  // MATERIAL TERRENO
  // ==================================================

  const material =
    new THREE.MeshStandardMaterial({
      color: 0x787ca5,
      roughness: 0.9,
      metalness: 0,
      side: THREE.DoubleSide
    });


  terreno =
    new THREE.Mesh(
      geometry,
      material
    );


  scene.add(
    terreno
  );


  // ==================================================
  // CÁMARA
  // ==================================================

  const maxDim =
    Math.max(
      anchoTerreno,
      altoTerreno
    );


  camera.position.set(
    maxDim * 0.55,
    -maxDim * 0.75,
    maxDim * 0.55
  );


  controls.target.set(
    0,
    0,
    1500
  );


  controls.update();


  estado.innerText =
    "DEM cargado · cargando lago...";


  await cargarLago();


  estado.innerText =
    "Visor listo · pulsa 8";

}


// ==================================================
// CONVERTIR GTM A COORDENADAS LOCALES
// ==================================================

function gtmALocal(
  x,
  y
) {

  const localX =
    x -
    centroX;


  const localY =
    y -
    centroY;


  return new THREE.Vector2(
    localX,
    localY
  );

}


// ==================================================
// CARGAR LAGO
// ==================================================

async function cargarLago() {

  const response =
    await fetch(
      RUTA_LAGO
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "No se pudo cargar lago2.geojson"
    );

  }


  const geojson =
    await response.json();


  console.log(
    "Lago GeoJSON:",
    geojson
  );


  aguaGrupo =
    new THREE.Group();


  scene.add(
    aguaGrupo
  );


  // ==================================================
  // NIVEL VERTICAL
  // ==================================================

  nivelAguaOriginal =
    (
      COTA_LAGO -
      elevMin
    ) *
    EXAGERACION_VERTICAL +
    5;


  aguaGrupo.position.z =
    nivelAguaOriginal;


  // ==================================================
  // MATERIAL AGUA
  // ==================================================

  const materialAgua =
    new THREE.MeshPhysicalMaterial({

      color:
        0x1687b8,

      transparent:
        true,

      opacity:
        0.76,

      roughness:
        0.15,

      metalness:
        0.05,

      transmission:
        0.08,

      side:
        THREE.DoubleSide

    });


  // ==================================================
  // CREAR POLÍGONOS
  // ==================================================

  for (
    const feature
    of geojson.features
  ) {

    if (
      !feature.geometry
    ) {

      continue;

    }


    let poligonos = [];


    if (
      feature.geometry.type ===
      "Polygon"
    ) {

      poligonos = [
        feature.geometry.coordinates
      ];

    }


    else if (
      feature.geometry.type ===
      "MultiPolygon"
    ) {

      poligonos =
        feature.geometry.coordinates;

    }


    else {

      continue;

    }


    for (
      const poligono
      of poligonos
    ) {

      const exterior =
        poligono[0].map(
          c =>
            gtmALocal(
              c[0],
              c[1]
            )
        );


      const shape =
        new THREE.Shape();


      shape.moveTo(
        exterior[0].x,
        exterior[0].y
      );


      for (
        let i = 1;
        i < exterior.length;
        i++
      ) {

        shape.lineTo(
          exterior[i].x,
          exterior[i].y
        );

      }


      // huecos interiores

      if (
        poligono.length > 1
      ) {

        for (
          let h = 1;
          h < poligono.length;
          h++
        ) {

          const hueco =
            poligono[h].map(
              c =>
                gtmALocal(
                  c[0],
                  c[1]
                )
            );


          const path =
            new THREE.Path();


          path.moveTo(
            hueco[0].x,
            hueco[0].y
          );


          for (
            let i = 1;
            i < hueco.length;
            i++
          ) {

            path.lineTo(
              hueco[i].x,
              hueco[i].y
            );

          }


          shape.holes.push(
            path
          );

        }

      }


      const geometry =
        new THREE.ShapeGeometry(
          shape
        );


      const agua =
        new THREE.Mesh(
          geometry,
          materialAgua
        );


      aguaGrupo.add(
        agua
      );

    }

  }


  console.log(
    "Lago creado"
  );

}


// ==================================================
// ANIMACIÓN VACIAR / LLENAR
// ==================================================

function animarAgua(
  vaciar
) {

  if (
    !aguaGrupo ||
    animando
  ) {

    return;

  }


  animando = true;


  const inicio =
    performance.now();


  const zInicial =
    aguaGrupo.position.z;


  const zFinal =
    vaciar

      ?

      nivelAguaOriginal -
      PROFUNDIDAD_VACIADO *
      EXAGERACION_VERTICAL

      :

      nivelAguaOriginal;


  estado.innerText =
    vaciar
      ?
      "Vaciando lago..."
      :
      "Llenando lago...";


  function paso(
    ahora
  ) {

    const t =
      Math.min(
        (
          ahora -
          inicio
        ) /
        2500,
        1
      );


    const suave =
      t < 0.5

        ?

        2 *
        t *
        t

        :

        1 -
        Math.pow(
          -2 * t + 2,
          2
        ) / 2;


    aguaGrupo.position.z =
      THREE.MathUtils.lerp(
        zInicial,
        zFinal,
        suave
      );


    aguaGrupo.traverse(
      obj => {

        if (
          obj.isMesh &&
          obj.material
        ) {

          obj.material.opacity =
            vaciar

              ?

              THREE.MathUtils.lerp(
                0.76,
                0.05,
                suave
              )

              :

              THREE.MathUtils.lerp(
                0.05,
                0.76,
                suave
              );

        }

      }
    );


    if (
      t < 1
    ) {

      requestAnimationFrame(
        paso
      );

    }


    else {

      lagoVacio =
        vaciar;


      animando =
        false;


      estado.innerText =
        lagoVacio

          ?

          "Lago vacío · batimetría visible"

          :

          "Lago lleno · pulsa 8";

    }

  }


  requestAnimationFrame(
    paso
  );

}


// ==================================================
// TECLA 8
// ==================================================

window.addEventListener(
  "keydown",
  e => {

    if (
      e.code ===
      "Digit8" ||
      e.code ===
      "Numpad8"
    ) {

      animarAgua(
        !lagoVacio
      );

    }

  }
);


// ==================================================
// RESIZE
// ==================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// ==================================================
// LOOP
// ==================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}

animate();


// ==================================================
// INICIAR
// ==================================================

cargarDEM()
  .catch(
    error => {

      console.error(
        error
      );


      estado.innerText =
        "ERROR: " +
        error.message;

    }
  );

</script>

</body>
</html>
