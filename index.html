<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cuenca del Lago de Atitlán - Visor 3D</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #visor {
      width: 100%;
      height: 100%;
    }

    #titulo {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 12px 18px;
      border-radius: 8px;
    }

    #titulo h2 {
      margin: 0 0 5px 0;
    }

    #estado {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>

<body>

<div id="titulo">
  <h2>Cuenca del Lago de Atitlán</h2>
  <div id="estado">Cargando modelo 3D...</div>
</div>

<div id="visor"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const contenedor = document.getElementById("visor");
const estado = document.getElementById("estado");


// ESCENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd8e8);


// CÁMARA
const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000000
);

camera.position.set(0, -30000, 18000);


// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

contenedor.appendChild(renderer.domElement);


// CONTROLES
const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.05;


// LUCES
scene.add(
  new THREE.AmbientLight(
    0xffffff,
    1.8
  )
);

const sol = new THREE.DirectionalLight(
  0xffffff,
  2.2
);

sol.position.set(
  -20000,
  -20000,
  40000
);

scene.add(sol);


// CARGAR GLTF
const loader = new GLTFLoader();

loader.load(
  "data/MODELO5.gltf",

  function(gltf) {

    const modelo = gltf.scene;

    scene.add(modelo);


    // Calcular tamaño del modelo
    const box = new THREE.Box3().setFromObject(modelo);

    const size = new THREE.Vector3();
    const center = new THREE.Vector3();

    box.getSize(size);
    box.getCenter(center);


    console.log("Tamaño modelo:", size);
    console.log("Centro modelo:", center);


    // Centrar modelo
    modelo.position.x -= center.x;
    modelo.position.y -= center.y;
    modelo.position.z -= center.z;


    // Recalcular bbox después de centrar
    const maxDim = Math.max(
      size.x,
      size.y,
      size.z
    );


    // Cámara automática
    camera.position.set(
      0,
      -maxDim * 1.2,
      maxDim * 0.7
    );


    controls.target.set(
      0,
      0,
      0
    );

    controls.update();


    estado.innerText =
      "Modelo 3D cargado";

  },

  function(xhr) {

    if (xhr.total) {

      const porcentaje =
        Math.round(
          xhr.loaded /
          xhr.total *
          100
        );

      estado.innerText =
        "Cargando modelo: " +
        porcentaje +
        "%";

    }

  },

  function(error) {

    console.error(
      "Error cargando GLTF:",
      error
    );

    estado.innerText =
      "ERROR cargando MODELO5.gltf";

  }
);


// REDIMENSIONAR
window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// ANIMACIÓN
function animate() {

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
